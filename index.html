<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital SAT Math Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;family=Noto+Serif:ital,wght@0,400;0,600;1,400&amp;display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer="" src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer="" src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{--rw:min(40vw,520px);--fg:#1b1d24;--mut:#666b78;--line:#dde1ea;--pri:#3054d4;--pri2:#2240b3;--sel:#edf2ff;--bad:#d64545;--ok:#1f9d55;--hdr:#f2f5fb;--hh:76px;--fh:68px;--cw:min(42vw,580px)}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.55 Inter,system-ui,"Segoe UI",Arial,sans-serif;color:var(--fg);background:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
.btn{background:var(--pri);color:#fff;border:0;border-radius:999px;padding:9px 24px;font-weight:600;transition:background .15s,transform .05s}
.btn:hover{background:var(--pri2)}.btn:active{transform:translateY(1px)}
.btn.o{background:#fff;color:var(--pri);box-shadow:inset 0 0 0 1.5px var(--pri)}.btn.o:hover{background:var(--sel)}
.btn:disabled{opacity:.35;cursor:default}

/* ---------- home ---------- */
.home{min-height:100vh;background:radial-gradient(1200px 500px at 10% -10%,#dfe7ff 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#e6f4ff 0,transparent 55%),#f7f8fc}
.wrap{max-width:780px;margin:0 auto;padding:48px 22px 60px}
.brand{display:flex;align-items:center;gap:12px;color:var(--pri);font-weight:700;letter-spacing:.02em;font-size:14px;text-transform:uppercase}
.brand i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3a63f0,#1b2f8f);display:grid;place-items:center;color:#fff;font-style:normal;font-size:17px}
.home h1{font-size:40px;line-height:1.15;margin:14px 0 8px;letter-spacing:-.02em}
.home .sub{color:var(--mut);margin:0 0 26px;font-size:17px}
.name{display:flex;gap:10px;align-items:center;margin-bottom:22px}
.name input{font:inherit;font-size:17px;padding:11px 16px;border:1.5px solid var(--line);border-radius:12px;width:300px;max-width:100%;background:#fff;outline:none}
.name input:focus{border-color:var(--pri);box-shadow:0 0 0 4px #3054d420}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;gap:14px;box-shadow:0 1px 2px #0000000a,0 6px 20px -12px #1b2f8f33;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 1px 2px #0000000a,0 14px 30px -14px #1b2f8f55}
.card .ic{width:48px;height:48px;border-radius:12px;background:var(--sel);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.card .meta{flex:1}.card .meta b{font-size:17px}.card small{color:var(--mut)}
.card.res{background:linear-gradient(90deg,#edf2ff,#fff)}
.chip{display:inline-block;background:#eef1f7;border-radius:999px;padding:1px 9px;font-size:12px;color:var(--mut);margin-right:6px;font-weight:600}

/* ---------- test shell ---------- */
header.top{position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:60;background:var(--hdr);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px}
header.top::after,footer.nav::before{content:"";position:absolute;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,#1b1d24 0 14px,transparent 14px 20px)}
header.top::after{bottom:0}footer.nav::before{top:0}
.sec b{font-size:19px;display:block;line-height:1.2}.sec .tool{padding:2px 0;font-size:14px;color:var(--fg);font-weight:500}
.timer{text-align:center}.timer #tm{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;display:block;min-height:30px}
.timer.low #tm{color:var(--bad)}
.timer .hide{border:1.5px solid var(--fg);border-radius:999px;background:#fff;padding:0 14px;font-weight:600;font-size:13px}
.tools{display:flex;gap:4px;justify-content:flex-end}
.tool{background:none;border:0;padding:4px 10px;border-radius:10px}
.tools .tool{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:13px;font-weight:500;min-width:74px}
.tools .tool svg{width:24px;height:24px}
.tools .tool:hover{background:#e2e8f5}.tools .tool.on{background:#dfe6fa;color:var(--pri2)}
main.q{padding:calc(var(--hh) + 26px) 28px calc(var(--fh) + 40px);transition:margin-left .25s ease}
.qin{max-width:800px;margin:0 auto}
.qhead{display:flex;align-items:center;gap:14px;background:#f0f2f7;height:44px;padding-right:10px;position:relative;margin-bottom:22px}
.qhead::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:repeating-linear-gradient(90deg,#1b1d24 0 10px,transparent 10px 15px)}
.num{background:var(--fg);color:#fff;height:100%;min-width:44px;display:grid;place-items:center;font-weight:700;font-size:17px}
.flag{background:none;border:0;display:flex;align-items:center;gap:7px;font-size:15px;font-weight:500;padding:4px 6px;border-radius:6px}.flag:hover{background:#e3e7f0}
.abc{margin-left:auto;border:0;border-radius:6px;padding:2px 8px;font-weight:700;font-size:14px;text-decoration:line-through;background:#fff;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--fg)}
.abc.on{background:var(--pri);color:#fff;box-shadow:none}
.qtext{font-family:"Noto Serif",Georgia,"Times New Roman",serif;font-size:19px;line-height:1.65;margin-bottom:22px}
.qtext .katex-display{margin:.55em 0}
.qtext .rn{margin:10px 0 4px 6px}
table.dt{border-collapse:collapse;margin:4px auto 16px;font-size:18px}
table.dt th,table.dt td{border:1.5px solid #3b82c4;padding:7px 18px;text-align:center}
table.dt th{background:#eaf4fc;font-weight:600}
.qtext table:not(.dt){border-collapse:collapse;margin:8px 0}.qtext table:not(.dt) td,.qtext table:not(.dt) th{border:1px solid var(--line);padding:5px 12px}
.chs{display:flex;flex-direction:column;gap:12px}
.chrow{display:flex;align-items:center;gap:10px}
.ch{flex:1;display:flex;align-items:center;gap:14px;border:1.5px solid #8b8f9a;border-radius:10px;padding:11px 16px;cursor:pointer;background:#fff;transition:border-color .12s,background .12s,box-shadow .12s;position:relative}
.ch:hover{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.ch.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri);background:var(--sel)}
.ch .t{flex:1;font-family:"Noto Serif",Georgia,serif;font-size:18px}
.L{width:30px;height:30px;border-radius:50%;border:1.8px solid var(--fg);display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.ch.sel .L{background:var(--pri);color:#fff;border-color:var(--pri)}
.ch.el{opacity:.55}.ch.el::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;background:var(--fg)}
.x{background:none;border:1.5px solid var(--fg);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.x.u{width:auto;border:0;text-decoration:underline;font-weight:600;font-size:14px}
.sprbox{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
input.spr{font:600 22px Inter,sans-serif;padding:10px 16px;border:0;border-bottom:2.5px solid var(--fg);border-radius:8px 8px 0 0;width:210px;background:#f4f6fa;outline:none}
input.spr:focus{border-color:var(--pri);background:var(--sel)}
.prev{color:var(--mut);font-size:14px}.prev div{font-size:22px;color:var(--fg);min-height:34px}
.hint{color:var(--mut);font-size:14px;margin-top:14px}
footer.nav{position:fixed;left:0;right:0;bottom:0;height:var(--fh);z-index:60;background:var(--hdr);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px}
footer.nav .who{font-size:18px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
footer.nav .r{justify-self:end;display:flex;gap:10px}
.pill{background:var(--fg);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:600;display:flex;align-items:center;gap:8px}
.pop{position:fixed;left:50%;bottom:calc(var(--fh) + 12px);transform:translateX(-50%);width:min(580px,94vw);background:#fff;border-radius:16px;box-shadow:0 20px 60px -10px #0005,0 0 0 1px #0001;padding:20px 22px;z-index:70;animation:up .18s ease}
.pop::after{content:"";position:absolute;left:50%;bottom:-8px;width:16px;height:16px;background:#fff;transform:translateX(-50%) rotate(45deg)}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
.pop .lg{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--mut);padding-bottom:10px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:12px;margin:14px 0}
.g{height:44px;border:1.5px dashed #8b8f9a;background:#fff;color:var(--pri);border-radius:6px;position:relative;font-weight:700}
.g.done{border:0;background:var(--pri);color:#fff}.g.cur::before{content:"📍";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:13px}
.g.f::after{content:"";position:absolute;top:-6px;right:-6px;width:14px;height:16px;background:var(--bad);clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.ok{color:var(--ok)}.bad{color:var(--bad)}

/* figure */
.fig{max-width:620px;margin:0 auto 18px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.zb{display:flex;gap:6px;justify-content:center;align-items:center;background:#f6f7fa;padding:5px;border-bottom:1px solid var(--line)}
.zb button{background:none;border:0;font-size:15px;padding:3px 10px;border-radius:6px}.zb button:hover{background:#e6e9f1}
.zb span{font:600 13px Inter;color:var(--mut);min-width:44px;text-align:center}
.zv{overflow:auto;max-height:460px;text-align:center;padding:10px}
.zv img{height:auto}

/* ---------- calculator (Bluebook style: docked left, question slides right) ---------- */
#desmos{position:fixed;left:var(--cx,0px);top:var(--cy,var(--hh));height:var(--ch,calc(100vh - var(--hh) - var(--fh)));width:var(--cw);background:#fff;z-index:50;display:none;flex-direction:column;box-shadow:6px 0 24px -12px #0004;animation:slide .22s ease}
@keyframes slide{from{transform:translateX(-30px);opacity:0}}
body.cc #desmos{display:flex}
body.cc main.q{margin-left:var(--cw)}
body.cc.cfl main.q{margin-left:0}
body.cfl #desmos{border-radius:12px;box-shadow:0 24px 60px -12px #0007,0 0 0 1px #0002;animation:none}
body.cfl #dh{border-radius:12px 12px 0 0}
body.cfl #dc,body.cfl #dsci{border-radius:0 0 12px 12px;overflow:hidden}
#dh{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#dh .ttl{pointer-events:none}.rb{user-select:none;-webkit-user-select:none}#dh button{cursor:pointer}
body.dragm,body.dragm *{cursor:grabbing!important}
body.cfl #drs::before{background:transparent}body.cfl #drs i{opacity:.75}body.cfl #dcr{border-bottom-right-radius:12px}
#dh .grabdots{display:flex;flex-direction:column;gap:3px;opacity:.55;margin-right:2px}
#dh .grabdots i{display:block;width:14px;height:2px;background:#fff;border-radius:2px}
body.rr main.q{margin-right:var(--rw)}
main.q{transition:margin .25s ease}
body.drag main.q{transition:none}
#dh{background:#1b1d24;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;flex:none}
#dh .ttl{font-weight:700;margin-right:4px}
.ct{display:flex;background:#33363f;border-radius:9px;padding:3px}
.ct button{border:0;border-radius:7px;padding:4px 12px;font-weight:600;font-size:14px;background:none;color:#cfd2da}
.ct .on{background:#fff;color:#111}
#dh .sp{flex:1}
#dh .ib{background:none;border:0;color:#fff;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:18px}
#dh .ib:hover{background:#ffffff22}
#dh .cx{font-size:22px}
#dc,#dsci{flex:1;min-height:0}
body.drag,body.drag *{cursor:ew-resize!important;user-select:none}
body.dragc,body.dragc *{cursor:nwse-resize!important}body.dragc2,body.dragc2 *{cursor:nesw-resize!important}
body.drag iframe,body.drag #dc,body.drag #dsci{pointer-events:none}
.grip{position:absolute;bottom:0;width:22px;height:22px;z-index:3;touch-action:none}
.grip svg{width:100%;height:100%}
#dcr{right:0;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,#1b1d24 50%)}
#rcr{left:0;cursor:nesw-resize;background:linear-gradient(225deg,transparent 50%,#1b1d24 50%)}
.grip::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(var(--a,135deg),transparent 0 4px,#ffffff88 4px 5px);clip-path:polygon(100% 0,100% 100%,0 100%)}
#rcr::after{--a:225deg;clip-path:polygon(0 0,100% 100%,0 100%)}
.edge{position:absolute;top:0;bottom:0;width:14px;cursor:ew-resize;z-index:2;display:grid;place-items:center;touch-action:none}
.edge::before{content:"";width:4px;height:100%;background:#1b1d24}
.edge i{position:absolute;width:14px;height:46px;background:#1b1d24;border-radius:7px;display:grid;place-items:center}
.edge i::after{content:"";height:22px;border-left:1.5px solid #fff;border-right:1.5px solid #fff;width:4px}
.edge:hover::before,.edge:hover i{background:var(--pri)}
.load{display:grid;place-items:center;height:100%;color:var(--mut);position:absolute;inset:0;pointer-events:none}
#dc,#dsci{position:relative}

/* reference */
#drs{right:-7px}#rrs{left:-7px}
#rcr{left:-14px;bottom:8px;width:36px;height:36px;border-radius:50%;background:#fff;color:#111;box-shadow:0 2px 8px #0004,0 0 0 1px #0003;display:grid;place-items:center;z-index:5}
#rcr::after{display:none}#rcr svg{width:20px;height:20px}#rcr:hover{background:#eef2ff;color:var(--pri)}
.rb .rdots{margin-right:8px}.rb:hover .rdots{background:#ffffff18}.rb{cursor:grab}
/* ---- Bluebook-style calculator chrome ---- */
#dh{padding:10px 14px 10px 18px;gap:12px;min-height:64px}
#dh .ct{background:#fff;border-radius:12px;padding:0;border:2px solid #fff;overflow:hidden}
#dh .ct button{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:0;background:#1b1d24;color:#fff;font-weight:700;font-size:17px}
#dh .ct button svg{width:24px;height:24px;flex:none}
#dh .ct button.on{background:#fff;color:#111}#dh .ct button.on span{text-decoration:underline;text-underline-offset:3px}
#dh .sp{display:flex;justify-content:center}
.mvdots{display:grid;grid-template-columns:repeat(3,5px);gap:6px 7px;padding:8px 10px;border-radius:8px}
.mvdots i{width:5px;height:5px;border-radius:50%;background:#fff}
#dh:hover .mvdots{background:#ffffff18}
#dh .cx{width:40px;height:40px}
#desmos #drs::before,#desmos #drs i{display:none}#desmos #drs{width:12px;right:-6px}
#desmos{box-shadow:0 0 0 1px #1b1d24,6px 0 24px -12px #0004}
#dcr{right:-18px;bottom:8px;width:36px;height:36px;border-radius:50%;background:#fff;color:#111;box-shadow:0 2px 8px #0004,0 0 0 1px #0003;display:grid;place-items:center;z-index:5}
#dcr::after{display:none}#dcr svg{width:20px;height:20px;transform:rotate(0deg)}
#dcr:hover{background:#eef2ff;color:var(--pri)}
body.cfl #dcr{border-bottom-right-radius:50%;bottom:-14px;right:-14px}
#desmos{container-type:size}
#dh .ct{flex:none;min-width:0}
@container (max-width:440px){#dh .ct button span{display:none}#dh .ct button{padding:7px 12px}}
#refo{position:fixed;right:0;top:var(--hh);height:var(--rh,calc(100vh - var(--hh) - var(--fh)));width:var(--rw);background:#fff;z-index:55;display:flex;flex-direction:column;box-shadow:-8px 0 30px -12px #0005;animation:sr .2s ease}
@keyframes sr{from{transform:translateX(30px);opacity:0}}
.rb{background:#1b1d24;color:#fff;display:flex;align-items:center;gap:6px;padding:8px 10px 8px 16px;font-size:17px;flex:none}
.rb b{flex:1}
.rb button{background:none;border:0;color:#fff;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:18px}
.rb button:hover{background:#ffffff22}.rb .cx{font-size:22px}
.rbody{padding:18px 20px 30px;overflow:auto;flex:1;text-align:center}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 14px;align-items:end;justify-items:center}
.rt{width:100%;text-align:center}.rt.w2{grid-column:1/-1}.rt img{width:100%;height:auto}
.rfacts{list-style:none;padding:0;margin:26px 4px 0;text-align:left;font-family:"Noto Serif",Georgia,serif;font-size:17px}
.rfacts li{margin:0 0 14px}

/* modal */
.mask{position:fixed;inset:0;background:#10142a66;backdrop-filter:blur(2px);display:grid;place-items:center;z-index:90;animation:fd .15s}
@keyframes fd{from{opacity:0}}
.mask>div{background:#fff;padding:26px 28px;border-radius:18px;max-width:440px;box-shadow:0 30px 80px -20px #0007}
.mask h3{margin:0 0 6px}

/* review & results */
.page{min-height:100vh;background:#f7f8fc;padding:calc(var(--hh) + 30px) 20px 60px}
.panel{background:#fff;border-radius:18px;border:1px solid var(--line);padding:26px;max-width:760px;margin:0 auto 18px;box-shadow:0 10px 30px -18px #1b2f8f40}
.score{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--pri) calc(var(--p)*1%),#e7ebf5 0)}
.ring div{width:120px;height:120px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font-size:38px;color:var(--pri)}.ring small{color:var(--mut);font-size:12px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.stats span{background:#f2f4f9;border-radius:10px;padding:6px 12px;font-size:14px}
table.rt{border-collapse:collapse;width:100%;font-size:15px}
table.rt td,table.rt th{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left}
table.rt tr.r:hover{background:#f6f8fd;cursor:pointer}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-weight:700;font-size:13px}.tag.ok{background:#e6f6ec}.tag.bad{background:#fdeaea}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{border:0;background:#eef1f7;border-radius:999px;padding:6px 16px;font-weight:600}.tabs .on{background:var(--fg);color:#fff}

@media(max-width:900px){:root{--cw:min(48vw,460px)}.tools .tool{min-width:54px;font-size:12px}}
@media(max-width:680px){
 :root{--hh:64px;--fh:62px}
 header.top{padding:0 10px}.sec b{font-size:15px}.timer #tm{font-size:19px}.tools .tool{min-width:44px;font-size:0;padding:4px 6px}
 footer.nav{padding:0 10px}footer.nav .who{display:none}footer.nav{grid-template-columns:auto 1fr}footer.nav .pill{justify-self:start}
 main.q{padding-left:16px;padding-right:16px}
 #desmos,#refo{top:var(--py,var(--hh))!important;bottom:auto!important;border-radius:14px!important;overflow:visible!important;box-shadow:0 18px 50px -10px #0007,0 0 0 1px #0003!important}
 #desmos{left:var(--mcx,0px)!important;top:var(--mcy,var(--hh))!important;width:var(--mcw,100vw)!important;height:var(--mch,56vh)!important}
 #refo{left:var(--mrx,0px)!important;right:auto!important;top:var(--mry,var(--hh))!important;width:var(--mrw,100vw)!important;height:var(--mrh,56vh)!important}
 #dh{border-radius:14px 14px 0 0!important}.rb{border-radius:14px 14px 0 0}
 #dc,#dsci{border-radius:0 0 14px 14px;overflow:hidden}.rbody{border-radius:0 0 14px 14px}
 body.cc main.q,body.rr main.q{margin-left:0;margin-right:0}
 #dh,.rb{cursor:move;touch-action:none}
 #dh .ct button{padding:6px 9px}#dh .ct button span{display:none}
 #drs,#rrs{display:none!important}
 #dcr,#rcr{display:grid!important;bottom:6px!important;width:42px!important;height:42px!important;border-radius:50%!important;touch-action:none}
 #dcr{right:6px!important}#rcr{left:6px!important}
 .rb .ex{display:none}
 .home h1{font-size:30px}.score{grid-template-columns:1fr;justify-items:center}
}

/* ---------- question editor ---------- */
.edimg{border:2px dashed #c4ccdb;border-radius:12px;padding:12px;text-align:center;background:#fafbfd;transition:border-color .15s,background .15s}
.edimg.drag{border-color:var(--pri);background:var(--sel)}
.edimg img{max-width:100%;max-height:220px;border-radius:6px;background:#fff;box-shadow:0 0 0 1px var(--line)}
.edimg .noimg{color:var(--mut);padding:18px 0 6px;font-size:15px}
.edimgb{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.btn.sm{padding:5px 14px;font-size:14px}
.hint2{font-size:12.5px;color:var(--mut);margin-top:8px}
.edsz{display:flex;align-items:center;gap:10px;justify-content:center;margin-top:10px;font-size:14px;font-weight:600}.edsz input{width:180px}
.edfoot .st.bad{color:var(--bad)}.edfoot .st.busy{color:var(--mut)}
.pwrow{display:flex;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}.pwrow:focus-within{border-color:var(--pri);box-shadow:0 0 0 3px #3054d420}
.pwrow input{flex:1;border:0;outline:none;font:inherit;font-size:17px;padding:11px 14px;min-width:0}.pweye{border:0;background:none;padding:0 12px;font-size:17px}
.pwe{color:var(--bad);font-size:14px;font-weight:600;min-height:20px;margin-top:8px}
.shake{animation:shk .35s}@keyframes shk{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.edbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:-6px 0 18px}
.sw{display:inline-flex;align-items:center;gap:10px;background:#fff;border:1.5px solid var(--line);border-radius:999px;padding:6px 14px 6px 8px;font-weight:600;cursor:pointer;user-select:none}
.sw i{width:38px;height:22px;border-radius:11px;background:#cdd3df;position:relative;transition:background .15s}
.sw i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 3px #0003}
.sw.on i{background:var(--pri)}.sw.on i::after{left:19px}
.edinfo{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff8e6;border:1px solid #f1d58a;border-radius:12px;padding:8px 12px;font-size:14px}
.edq{border:0;background:#fff;border-radius:6px;padding:3px 10px;font-weight:700;font-size:14px;box-shadow:inset 0 0 0 1.5px var(--pri);color:var(--pri);margin-left:auto}
.edq+.abc{margin-left:8px}
.edq:hover{background:var(--sel)}
.ed .edbox{background:#fff;border-radius:18px;width:min(1180px,96vw);height:min(860px,92vh);display:flex;flex-direction:column;overflow:hidden;padding:0!important;max-width:none!important}
.edh{display:flex;align-items:center;gap:10px;padding:12px 16px;background:#1b1d24;color:#fff;flex-wrap:wrap}
.edh b{font-size:16px;margin-right:auto}
.edh select,.edh button{font:inherit;font-size:14px;border:0;border-radius:8px;padding:6px 10px;background:#33363f;color:#fff}
.edh button:hover{background:#4a4e5a}.edh .x2{font-size:20px;padding:2px 10px;background:none}
.edm{flex:1;display:grid;grid-template-columns:1fr 1fr;min-height:0}
.edf{padding:16px 18px;overflow:auto;border-right:1px solid var(--line)}
.edp{padding:16px 22px;overflow:auto;background:#fbfcfe}
.edf label{display:block;font-weight:700;font-size:13px;color:var(--mut);margin:12px 0 5px;text-transform:uppercase;letter-spacing:.04em}
.edf textarea,.edf input[type=text]{width:100%;font:14px/1.5 ui-monospace,SFMono-Regular,Consolas,monospace;border:1.5px solid var(--line);border-radius:10px;padding:9px 11px;outline:none;background:#fff;color:var(--fg)}
.edf textarea{min-height:170px;resize:vertical}
.edf textarea:focus,.edf input[type=text]:focus{border-color:var(--pri);box-shadow:0 0 0 3px #3054d420}
.edc{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:center;margin-bottom:8px}
.edc .rad{display:flex;align-items:center;gap:6px;font-weight:700;cursor:pointer;padding:4px 8px;border-radius:8px;border:1.5px solid var(--line)}
.edc .rad.on{border-color:var(--ok);background:#e9f7ef;color:var(--ok)}
.edtype{display:flex;gap:6px}.edtype button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font-weight:600;font-size:14px}.edtype .on{border-color:var(--pri);background:var(--sel);color:var(--pri)}
.tips{font-size:13px;color:var(--mut);background:#f4f6fa;border-radius:10px;padding:10px 12px;margin-top:14px;line-height:1.7}
.tips code{background:#fff;border:1px solid var(--line);border-radius:5px;padding:0 5px;color:var(--fg);font-size:12.5px}
.edp .ptag{font-weight:700;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;margin-bottom:10px}
.edp .ch.ok{border-color:var(--ok);box-shadow:0 0 0 2px var(--ok);background:#e9f7ef}
.edp img{max-width:100%;height:auto}
.edfoot{display:flex;align-items:center;gap:10px;padding:12px 16px;border-top:1px solid var(--line);flex-wrap:wrap}
.edfoot .st{margin-right:auto;font-size:14px;font-weight:600}
.edfoot .st.chg{color:#b7791f}.edfoot .st.sv{color:var(--ok)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#1b1d24;color:#fff;padding:10px 18px;border-radius:12px;z-index:200;font-weight:600;box-shadow:0 10px 30px #0004;animation:up .2s}
@media(max-width:760px){.edm{grid-template-columns:1fr}.edf{border-right:0;border-bottom:1px solid var(--line)}.edp{min-height:260px}.ed .edbox{height:96vh;width:100vw;border-radius:14px 14px 0 0}}

ate the average time this type of battery lasts under continuous use. Based on the first sample, the analyst estimated an average of 8.6 hours, with an associated margin of error of 0.4 hours. Based on the second sample, the analyst estimated an average of 8.9 hours, with an associated margin of error of 1.5 hours. Assuming the margins of error were calculated the same way, which of the following best explains why the first sample obtained a smaller margin of error than the second sample?","type":"mc","choices":["The first sample contained more batteries than the second sample.","The first sample contained fewer batteries than the second sample.","The batteries in the first sample lasted less time on average than those in the second sample.","The batteries in the first sample lasted more time on average than those in the second sample."],"answer":"A"},{"text":"In the figure shown, the measure of angle $P$ is $47^\\circ$. The length of $\\overline{PQ}$ is 30 units and the length of $\\overline{PR}$ is 19 units. What is the area, in square units, of triangle $PQR$?","type":"mc","choices":["285","570","$285\\sin 47^\\circ$","$570\\sin 47^\\circ$"],"answer":"C","img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAm0AAAE2CAIAAAC8yDJAAAAUZElEQVR42u3dfWydZd0H8Gv1iDKEwCidMDNJwAWhgTE0EzOfSiSTBaPdsMlEFBLTVmbMfP4ZnW4YIzHrgsMSo1g1YZoFk9bpErERZmTaLKvCIGBrN0jWVA1unr0oK8p21j5/HHKeQ9d2Xc/b/fL5/NVz79CWu92+57p/53tf8yYmJgIAMCd1TgEAyFEAkKMAIEcBQI4CAHIUAOQoAMhRAJCjAIAcBQA5CgByFADkKADIUQBAjgKAHAUAOQoAchQAkKMAUBYZp4Bq+tGPfpTL5ab4Rcxk6uvrP/ShD7373e92loAYmTcxMeEsUB0nTpy44447crncc889F0K46aab3vnOd4YQTp06dejQoRMnTmQymfXr1z/88MPOFSBHYWrPPvvsBz/4wbq6un//+98XXXRR/uDExMRDDz304IMPhhCeeOKJtWvXOlFALJiPUm379+8PISxZsqQQoiGEefPmbdy48eKLLw4hPPXUU84SIEdhphxdtmzZpOOZTGZ8fDyE8Pa3v91ZAuQozJSjN99886TjBw4cGBsbCyGsWLHCWQLkKEzhzJkzL7300pQ5+thjj4UQFi5c2Nzc7EQBcaH3QlUNDQ3997//nZSjb7zxxqOPPtrV1XX55Zfv3LkzPyUFkKMwWf6ibl1d3cqVK/NHxsbGRkZGbrnllm984xtf+tKXFixY4CwBchRmytHly5e3tbXlQ/RXv/rV8PDwyMjImjVrhCggR2Emzz//fAjhzjv n equation, $r$ is a constant. The equation has no solution. What is the value of $r$?","type":"spr","answer":["9"]},{"text":"$$-6x(x+8)=18$$ One solution to the given equation can be written as $z-\\frac a2\\sqrt b$, where $z$, $a$, and $b$ are integers and $a$ and $b$ are positive. What is the value of $\\frac ab$?","type":"mc","choices":["$\\frac1{26}$","$\\frac2{13}$","$\\frac4{13}$","$\\frac{13}2$"],"answer":"B"},{"text":"$$17(x-c)=17y+17c$$ One of the equations in a system of two linear equations is given, where $c$ is a positive constant. The system has no solution. Which equation could be the second equation in this system?","type":"mc","choices":["$3x-3y=6c$","$3x+3y=6c$","$3x-3y=3c$","$3x+3y=3c$"],"answer":"C"},{"text":"$$(x-m)^2=(m-6a)(x-m)$$ In the given equation, $a$ and $m$ are constants, where $m>6a$. The sum of the solutions to the equation is $3m+48$. What is the value of $a$?","type":"spr","answer":["-8"]},{"text":"The function $p$ is defined by $p(x)=a\\big((x+7)^2-b\\big)\\big((x+7)^2+c\\big)$, where $a$, $b$, and $c$ are constants. In the $xy$-plane, the graph of $y=p(x)$ passes through the points $(-9,44)$ and $(0,517)$. What is the value of $p(-5)+p(-14)$?","type":"spr","answer":["561"]},{"text":"A quadratic function models the height, in feet, of a projectile above the ground in terms of the time, in seconds, after the projectile was launched. According to the model, the projectile was launched from a height of 0 feet and reached its maximum height of 2,025 feet, 9 seconds after it was launched. Based on the model, what was the height, in feet, of the projectile 5 seconds after it was launched?","type":"spr","answer":["1625"]},{"text":"The equation $N(m)=80(Q)^{m/4}$ gives the predicted population $N(m)$, in thousands, of a bacteria colony $m$ minutes after the initial measurement, where $Q$ is a constant greater than 1. The predicted population increases by $p\\%$ every 240 seconds. What is the value of $p$ in terms of $Q$?","type":"mc","cho b$ is a positive constant?","type":"mc","choices":["$x^2+9b-5$","$x^2-9b+5$","$x^2+18b$","$x^2-5b$"],"answer":"A"},{"text":"On January 1, 1995, a company had 4,318 employees, and on January 1, 2015, the company had 5,058 employees. The equation $20x+4{,}318=5{,}058$ describes this situation. Which is the best interpretation of $x$ in this context?","type":"mc","choices":["The total increase in the number of employees between 1995 and 2015","The number of employees the company is projected to have in 2035","The average increase per year in the number of employees between 1995 and 2015","The percentage by which the number of employees increased each year between 1995 and 2015"],"answer":"C"},{"text":"The function $f$ is defined by $f(x)=x^3+5x^2-9x-63$. In the $xy$-plane, the graph of $y=h(x)$ is the result of translating the graph of $y=f(x)$ right 2 units and up 11 units. What is the $y$-coordinate of the $y$-intercept of the graph of $y=h(x)$?","type":"spr","answer":["-22"]},{"text":"In the $xy$-plane, an equation of circle $A$ is $x^2+y^2+10x-6y-2=0$. Circle $B$ has the same center as circle $A$ and a radius that is 3 times the radius of circle $A$. Which equation represents circle $B$?","type":"mc","choices":["$(x+5)^2+(y-3)^2=108$","$(x+5)^2+(y-3)^2=324$","$(x-5)^2+(y+3)^2=324$","$(x+5)^2+(y-3)^2=18$"],"answer":"B"},{"text":"A right circular cone has a volume of $240\\pi$ cubic centimeters, and the area of its base is $144\\pi$ square centimeters. What is the slant height, in centimeters, of this cone? <i>Note: Figure not drawn to scale.<\/i>","type":"mc","choices":["5","12","13","17"],"answer":"C","img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAa0AAAGtCAIAAAAqNLxgAAAxOUlEQVR42u3dfXhU1aEu8JWvMbCHwMQkk5iQCSSESBJAEQiiYgoc5AE9PbHBIrc+BfRaKPLQcumVwvFwUMTKobWWgj4K9tTyoKTmYsEiV5ALioRPBRIIIaFMSMynGQnZECeTmfvHtjuLtSfDfOw9sz/e3x8+2SMQ2Jl5Z+291nonyuPxEAAAA4vGKQAA5CAAAHIQAAA5CACAHAQAQA4CACAHAQCQgwAAyEEAAOQgAAByEAAAOQgAgBwEAEAOAgAgBwGUN39n9c4zrf/ouFm06ZTd0Y0TAuEXhf5Bi . The solution to the system is $(x,y)$, where $x=4$. What is the value of $k$?","type":"spr","answer":["7"]},{"text":"$$D=\\frac{0.75(h-8)}{2w}$$ The given equation relates the density $D$ of a beam to its height $h$, in centimeters, and its width $w$, in centimeters. Which equation correctly expresses the height of the beam in terms of its density and its width?","type":"mc","choices":["$h=\\frac{2wD}{0.75}-8$","$h=\\frac{2wD}{0.75}+8$","$h=\\frac{0.75wD}{2}+8$","$h=\\frac{2wD+8}{0.75}$"],"answer":"B"},{"text":"For the polynomial function $g$, the graph of $y=g(x)$ in the $xy$-plane passes through the points $(-8,0)$, $(2,0)$, and $(11,0)$. Which of the following must be a factor of $g(x)$?","type":"mc","choices":["$x+2$","$x-8$","$x-11$","$x+11$"],"answer":"C"},{"text":"$$f(x)=3^{-4(x+2)}$$ Which of the following equivalent forms of the given function $f$ displays, as the base or the coefficient, the $y$-coordinate of the $y$-intercept of the graph of $y=f(x)$ in the $xy$-plane?","type":"mc","choices":["$f(x)=\\frac1{6{,}561}\\left(\\frac13\\right)^{4x}$","$f(x)=\\left(\\frac13\\right)^{4x+8}$","$f(x)=3^{-4x-8}$","$f(x)=6{,}561^{-x-2}$"],"answer":"A"},{"text":"In the $xy$-plane, line $k$ is perpendicular to the line defined by $4x+7y=21$, has an $x$-intercept of $(-8,0)$, and has a $y$-intercept of $(0,p)$. What is the value of $p$?","type":"spr","answer":["14"]},{"text":"The vertex of a parabola is at $(34,-19)$. If one of the $x$-intercepts is at $x=51$, what is the $x$-coordinate of the second $x$-intercept of the parabola?","type":"mc","choices":["$-17$","17","23","68"],"answer":"B"},{"text":"The area of a solar panel array is increasing at a rate of 0.45 square meters per second. Which of the following is closest to this rate expressed in square feet per hour? (1 meter = 3.28 feet)","type":"mc","choices":["1,476","5,313","17,429","57,166"],"answer":"C"},{"text":"The length of a copper wire, in millimeters, is given by $L(T)=0.0045(T-15)+320$, where $T$ is the temperature in degrees Celsius. If the temperature increases by 400 degrees Celsius, by how much does the length of the wire increase, in millimeters?","type":"mc","choices":["1.8","4.5","18","321.8"],"answer":"A"},{"text":"A quality engineer selected 2 random samples of a certain model of battery to estimate the average number of hours the battery lasts under continuous use. Based on the first sample, the engineer estimated an average of 18.6 hours, with an associated margin of error of 0.8 hour. Based on the second sample, the engineer estimated an average of 18.9 hours, with an associated margin of error of 1.9 hours. Assuming the margins of error were calculated the same way, which best explains why the first sample obtained a smaller margin of error than the second sample?","type":"mc","choices":["The first sample contained fewer batteries than the second sample.","The first sample contained more batteries than the second sample.","The batteries in the first sample lasted fewer hours on average than those in the second sample.","The batteries in the first sample lasted more hours on average than those in the second sample."],"answer":"B"},{"text":"Which expression is equivalent to $3x^3+15x^2y+2xy^2+10y^3$?","type":"mc","choices":["$(3x^2+10y)(x+y^2)$","$(3x^2+2y^2)(x+5y)$","$(3x^3+2y^2)(x^2+5y^3)$","$(3x^3+2y^3)(x+5y)$"],"answer":"B"},{"text":"The function $f$ is defined by $f(x)=ab^{x/n}$, where $a$, $b$, and $n$ are constants, and $b$ and $n$ are integers. If $f(4)=5$ and $f(10)=320$, what is the value of $f(13)$?","type":"mc","choices":["640","1,280","2,560","20,480"],"answer":"C"},{"text":"Data set $M$ consists of 60 integers, where the value of each integer is between 120 and 180. Data set $N$ consists of the same 60 integers in $M$ as well as the integer 940. Which of the following must be greater for data set $N$ than for data set $M$?<br>I. The mean<br>II. The median","type":"mc","choices":["I only","II only","I and II","Neither I nor II"],"answer":"A"},{"text":"The function $f$ is defined by $f(x)=a^x-b$, where $a$ and $b$ are constants. In the $xy$-plane, the graph of $y=f(x)$ passes through the points $(c,5)$ and $(2c,137)$, where $c$ is a constant. Which of the following could be the value of $b$?","type":"mc","choices":["7","12","132","144"],"answer":"A"},{"text":"The scatterplot shows data set $A$, which consists of the masses $y$, in grams, of a rabbit kit at various ages $x$, in weeks. The equation of a line of best fit for the relationship in data set $A$ can be written as $y=3.2+10.7x$, where $1\\le x\\le 5$.<br>The rabbit kit was weighed again at 8 weeks old and had a mass of 120 grams. Data set $B$ consists of all the data points in data set $A$ as well as the data point $(8,120)$. The equation of a line of best fit for data set $B$ can be written as $y=r+sx$, where $r$ and $s$ are constants and $1\\le x\\le 8$. Assuming the equations of the lines of best fit are calculated in the same way, which of the following is the best estimate for the value of $s$?","type":"mc","choices":["6.4","10.7","14.9","21.3"],"answer":"C","img":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAg0AAAG3CAIAAAC4w/FNAABF2klEQVR42u3de0CM2eM/8DPdp5TuKuk6KU1S0QVJg4TcPlqs27qUpUQWaxcpH/uxWbel9MklZC2LirRkhB8qSe6STalQKZXaLtM0M03z++P5fOc73ynJ5YNm3q+/zHnOTHOOM/Oe5znneR6aSCQiAAAAb6CALgAAAOQEAAAgJwAAADkBAADICQAAQE4AAAByAgAAkBMAAICc+MLk5OQMGzZs3Lhxb61ZV1fn6upqZ2eXn5/ffqtAIIiKiho5cqSzs7O/vz+bzcZoAABoT6kbvdfm5ub169f/+9//bmlpsbW1fWv9FStW3L59mxDS0tIitYnH440ePTo/Pz8mJsbe3v706dN+fn4RERHh4eEYEwAA3TInuFyug4ND37592Wy2t7f3W+tfvHjx5MmT5ubmz58/b781PDw8PT09LS3Nx8eHEGJvb19VVRUREeHt7e3l5YVhAQAg1m2OO7W1tUVERLDZbHNz87dW5nA4ixYtioiIMDU1bb+1sbExOjqawWBQIUEJDg4mhERGRmJMAAB0y5zQ0NCYO3duFyuvW7dOR0dnxYoVHW5NS0vjcrmenp6Shba2toaGhpcvX25qasKwAADofjnRddnZ2bGxsXFxcUpKHR9Vu3fvHiHE2tpaqtza2logEOTl5WFYAACIKclYe/h8fmBg4PLly52dnd9Up7S0lBCir68vVW5gYEAIKSsrc3d3f+sfah8zAABfuKKiIuxPkE2bNvF4vA0bNnRSh8PhEEJUVVWlyqkSHHcCAJDZ/YlHjx5t3ryZzWbT6fROqikrKxNCWltbpcqpEhUVFQwLAAAZzIm2 x+9u$. If $\\cos(q)=\\sin(u)$, which of the following represents the value of $h(0)$ in terms of $u$?","type":"mc","choices":["$10u+\\dfrac{\\pi}{2}$","$8u+\\pi$","$8u+\\dfrac{\\pi}{2}$","$9u$"],"answer":"C"}]]},{"id":14,"title":"SAT Practice Test 14","time":2100,"modules":[[{"text":"<table class='dt'><tr><th>Nights<\/th><th>Guests<\/th><\/tr><tr><td>1<\/td><td>17<\/td><\/tr><tr><td>2<\/td><td>24<\/td><\/tr><tr><td>3<\/td><td>11<\/td><\/tr><tr><td>4<\/td><td>8<\/td><\/tr><\/table>The table summarizes the number of nights per week that each of 60 hotel guests stayed at a hotel. According to the table, how many guests stayed for exactly 3 nights?","type":"mc","choices":["3","8","11","60"],"answer":"C"},{"text":"If $\\dfrac{2x+5}{3}-\\dfrac{x-4}{2}=3$, what is the value of $x$?","type":"mc","choices":["$-4$","8","12","20"],"answer":"A"},{"text":"The function $g$ is defined by $g(x)=\\dfrac{x+21}{6}$. If $g(2x+3)=7$, what is the value of $x$?","type":"mc","choices":["9","18","21","42"],"answer":"A"},{"text":"45% of a number is equal to 30% of 720. What is the number?","type":"spr","answer":["480"]},{"text":"$$W(d)=340-12d$$ The given function models the amount of water $W(d)$, in liters, remaining in a tank $d$ days after it was filled. Which of the following is the best interpretation of 340 in this context?","type":"mc","choices":["The number of liters of water in the tank when it was filled","The number of liters of water used each day","The number of days until the tank is empty","The number of liters of water remaining after 12 days"],"answer":"A"},{"text":"A cube has a surface area of 294 square centimeters. What is the volume, in cubic centimeters, of this cube?","type":"mc","choices":["49","294","343","2,058"],"answer":"C"},{"text":"On a map, the scale is $1:2{,}500{,}000$. Two towns are 6 centimeters apart on the map. What is the actual distance, in kilometers, between these two towns?","type":"mc","choices":["15","150","1,500","15,000"],"answer":"B"},{"text":"$$3x+4y=31$$ $$5x-6y=1$$ The solution to the given system of equations is $(x,y)$. What is the value of $y$?","type":"mc","choices":["4","5","9","19"],"answer":"A"},{"text":"Company A charges a $\\$90$ fee plus $\\$25$ per hour for a service. Company B charges a $\\$150$ fee plus $\\$15$ per hour for the same service. If $h$ represents the number of hours of service, what are all the values of $h$ for which Company B's total charge is less than Company A's total charge?","type":"mc","choices":["$h\\lt 6$","$h\\gt 6$","$h\\lt 24$","$h\\gt 24$"],"answer":"B"},{"text":"A culture starts with 1,250 bacteria, and the number of bacteria doubles every 40 minutes. Which equation gives the number of bacteria, $N$, in the culture $h$ hours after the culture starts?","type":"mc","choices":["$N=1{,}250(2)^{40h}$","$N=1{,}250(2)^{\\frac{2h}{3}}$","$N=1{,}250(2)^{\\frac{3h}{2}}$","$N=1{,}250(2)^{\\frac{h}{40}}$"],"answer":"C"},{"text":"In the $xy$-plane, line $p$ has a slope of $\\dfrac75$ and a $y$-intercept of $(0,-21)$. What is the $x$-coordinate of the $x$-intercept of line $p$?","type":"spr","answer":["15"]},{"text":"At a school with 500 students, each student travels to school by bus, by bicycle, or on foot. If one of these students is selected at random, the probability of selecting a student who travels by bus is 0.34, and the probability of selecting a student who travels by bicycle is 0.22. How many of these students travel to school on foot?","type":"mc","choices":["110","170","220","280"],"answer":"C"},{"text":"$$y=3(x-2)(x-10)$$ What is the minimum value of $y$ for the given equation?","type":"mc","choices":["$-48$","$-16$","6","60"],"answer":"A"},{"text":"What is the value of $\\tan B$ in the triangle shown?","type":"mc","choices":["$\\dfrac{5}{13}$","$\\dfrac{5}{12}$","$\\dfrac{12}{13}$","$\\dfrac{12}{5}$"],"answer":"B","img":"data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20540%20315%27%20width%3D%27540%27%  what percent of $c$? (Disregard the percent symbol when entering your answer.)","type":"spr","answer":["100"]},{"text":"$$4x-6y=14$$ $$10x+ky=c$$ In the given system of equations, $k$ and $c$ are constants. If the system has infinitely many solutions, what is the value of $k+c$?","type":"spr","answer":["20"]},{"text":"A circle in the $xy$-plane has its center at $(-2,9)$, and the point $(6,3)$ lies on the circle. Which equation represents this circle?","type":"mc","choices":["$(x-2)^2+(y+9)^2=10$","$(x+2)^2+(y-9)^2=10$","$(x-2)^2+(y+9)^2=100$","$(x+2)^2+(y-9)^2=100$"],"answer":"D"},{"text":"$$f(x)=3(x+4)^2-11$$ In the $xy$-plane, the graph of $y=f(x)$ is translated 5 units to the right and 6 units up. What is the vertex of the resulting graph?","type":"mc","choices":["$(-9,-17)$","$(-9,-5)$","$(1,-17)$","$(1,-5)$"],"answer":"D"},{"text":"$$2\\sqrt{x+7}=x-1$$ What is the solution to the given equation?","type":"spr","answer":["9"]},{"text":"Two similar right circular cylinders have surface areas of $54\\pi$ square inches and $486\\pi$ square inches. The volume of the smaller cylinder is $40\\pi$ cubic inches. The volume of the larger cylinder is $V\\pi$ cubic inches, where $V$ is a constant. What is the value of $V$?","type":"spr","answer":["1080"]},{"text":"If $\\left(\\sqrt8\\right)^{a+2}=4^{a-1}$, what is the value of $a$?","type":"spr","answer":["10"]},{"text":"$$x^2-12x+c=0$$ In the given equation, $c$ is a constant. The equation has two distinct real solutions whose positive difference is 8. What is the value of $c$?","type":"mc","choices":["8","16","20","32"],"answer":"C"}],[{"text":"<table class='dt'><tr><th>$x$<\/th><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><\/tr><tr><th>$f(x)$<\/th><td>9<\/td><td>5<\/td><td>2<\/td><td>7<\/td><\/tr><tr><th>$g(x)$<\/th><td>3<\/td><td>1<\/td><td>4<\/td><td>2<\/td><\/tr><\/table>The table gives the values of the functions $f$ and $g$ at four values of $x$. What is the value of $f\\big(g(3)\\big)$?","type":"mc","choices":["2","4","7","9"],"answer":"C"},{"text":"Which expression is equivalent to $\\dfrac{x^2-36}{x^2-2x-24}$, where $x\\gt 6$?","type":"mc","choices":["$\\dfrac32$","$\\dfrac{x-6}{x+4}$","$\\dfrac{x+6}{x-4}$","$\\dfrac{x+6}{x+4}$"],"answer":"D"},{"text":"In one class of 20 students, the mean score on a test was 70. In a second class of $n$ students, the mean score on the same test was 90. The mean score for all the students in both classes was 82. What is the value of $n$?","type":"mc","choices":["25","30","35","40"],"answer":"B"},{"text":"If $7(3x-4)+20=4(3x-4)+41$, what is the value of $(3x-4)^3$?","type":"mc","choices":["7","21","343","2,401"],"answer":"C"},{"text":"The polynomial function $p$ is defined by $p(x)=a(x+2)(x-3)(x-5)$, where $a$ is a constant. In the $xy$-plane, the graph of $y=p(x)$ passes through the point $(1,48)$. What is the value of $p(0)$?","type":"mc","choices":["24","30","48","60"],"answer":"D"},{"text":"$$y\\ge 3x-5$$ $$y\\lt -2x+8$$ Which point $(x,y)$ is a solution to the given system of inequalities in the $xy$-plane?","type":"mc","choices":["$(0,-6)$","$(2,1)$","$(2,4)$","$(4,3)$"],"answer":"B"},{"text":"Line $m$ passes through the points $(-2,7)$ and $(6,1)$ in the $xy$-plane. Line $n$ is perpendicular to line $m$ and passes through the point $(9,-2)$. Which equation defines line $n$?","type":"mc","choices":["$3x+4y=19$","$4x-3y=42$","$4x+3y=30$","$3x-4y=35$"],"answer":"B"},{"text":"A linear model estimates the number of registered vehicles, in thousands, in a city. The model estimates there were 37 thousand registered vehicles in 2008, 154 thousand in 2023, and $x$ thousand in 2019. To the nearest whole number, what is the value of $x$?","type":"spr","answer":["123"]},{"text":"A sample of a substance decays so that its mass is reduced by $\\frac14$ of its value every 18 months. If the initial mass of the sample is $M$ grams, which expression gives the mass, in grams, of the sample $t$ years later?","type":"mc","choices":["$M\\left(\\dfrac14\\right)^{\\frac{2t}{3}}$","$M\\left(\\dfrac34\\right)^{\\frac{2t}{3}}$","$M\\left(\\dfrac34\\right)^{\\frac{3t}{2}}$","$M\\left(\\dfrac34\\right)^{18t}$"],"answer":"B"},{"text":"$$\\begin{cases}y=-3\\\\ y=x^2+14x+q\\end{cases}$$ In the given system of equations, $q$ is a positive integer constant. The system has no real solutions. What is the least possible value of $q$?","type":"mc","choices":["47","48","49","50"],"answer":"A"},{"text":"$$\\frac{x+4}{x-1}=\\frac{5}{x-1}+x$$ How many solutions does the given equation have?","type":"mc","choices":["Zero","Exactly one","Exactly two","Infinitely many"],"answer":"A"},{"text":"The weight of an object on the Moon is approximately $\\frac16$ of its weight on Earth. The weight of an object on Jupiter is approximately $\\frac52$ of its weight on Earth. If an object weighs 144 pounds on Earth, what is the difference, in pounds, between its weight on Jupiter and its weight on the Moon?","type":"spr","answer":["336"]},{"text":"Two similar pentagons have perimeters of 28 centimeters and 42 centimeters. The area of the smaller pentagon is 64 square centimeters. What is the area, in square centimeters, of the larger pentagon?","type":"spr","answer":["144"]},{"text":"A pump delivers water at a constant rate of 4.5 cubic meters per minute. What is this rate, in liters per second? (1 cubic meter = 1,000 liters)","type":"mc","choices":["0.075","75","270","4,500"],"answer":"B"},{"text":"In the $xy$-plane, a line with equation $1.5y=13.5$ intersects a parabola at exactly one point. If the parabola has equation $y=-4x^2+bx$, where $b$ is a positive constant, what is the value of $b$?","type":"spr","answer":["12"]},{"text":"In triangle $XYZ$, angle $Y$ is a right angle, the measure of angle $Z$ is $67^\\circ$, and the length of $\\overline{YZ}$ is 36 units. If the area, in square units, of triangle $XYZ$ can be represented by the expression $k\\tan(67^\\circ)$, where $k$ is a constant, what is the value of $k$?","type":"mc","choices":["18","36","648","1,296"],"answer":"C"},{"text":"In the $xy$-plane, the graph of $2x^2+2y^2-20x+12y+18=0$ is a circle. What is the area of the region enclosed by this circle?","type":"mc","choices":["$5\\pi$","$10\\pi$","$25\\pi$","$50\\pi$"],"answer":"C"},{"text":"For triangle $ABC$, the length of $\\overline{AB}$ is 17 less than the length of $\\overline{AC}$. Point $D$ (not shown) lies on $\\overline{AC}$ such that $\\overline{BD}$ (not shown) is perpendicular to $\\overline{AC}$. What is the value of $\\dfrac{BC}{BD}$?","type":"spr","answer":["43/26","1.653","1.654"],"img":"data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20560%20315%27%20width%3D%27560%27%20height%3D%27315%27%3E%3Crect%20width%3D%27560%27%20height%3D%27315%27%20fill%3D%27white%27/%3E%3Cpolygon%20points%3D%2780%2C40%2080%2C250%20480%2C250%27%20fill%3D%27none%27%20stroke%3D%27%233b82c4%27%20stroke-width%3D%272.4%27%20stroke-linejoin%3D%27round%27/%3E%3Cpolyline%20points%3D%2780%2C232%2098%2C232%2098%2C250%27%20fill%3D%27none%27%20stroke%3D%27%233b82c4%27%20stroke-width%3D%271.6%27/%3E%3Ctext%20x%3D%2776%27%20y%3D%2730%27%20font-size%3D%2719%27%20text-anchor%3D%27middle%27%20fill%3D%27%231b1d24%27%20font-family%3D%27Noto%20Serif%2C%20Georgia%2C%20Times%20New%20Roman%2C%20serif%27%20font-style%3D%27italic%27%20%3EA%3C/text%3E%3Ctext%20x%3D%2776%27%20y%3D%27276%27%20font-size%3D%2719%27%20text-anchor%3D%27middle%27%20fill%3D%27%231b1d24%27%20font-family%3D%27Noto%20Serif%2C%20Georgia%2C%20Times%20New%20Roman%2C%20serif%27%20font-style%3D%27italic%27%20%3EB%3C/text%3E%3Ctext%20x%3D%27494%27%20y%3D%27268%27%20font-size%3D%2719%27%20text-anchor%3D%27middle%27%20fill%3D%27%231b1d24%27%20font-family%3D%27Noto%20Serif%2C%20Georgia%2C%20Times%20New%20Roman%2C%20serif%27%20font-style%3D%27italic%27%20%3EC%3C/text%3E%3Ctext%20x%3D%27300%27%20y%3D%27135%27%20font-size%3D%2719%27%20text-anchor%3D%27middle%27%20fill%3D%27%231b1d24%27%20font-family%3D%27Noto%20Serif%2C%20Georgia%2C%20Times%20New%20Roman%2C%20serif%27%20%3E43%3C/text%3E%3Ctext%20x%3D%27280%27%20y%3D%27300%27%20font-size%3D%2714%27%20text-anchor%3D%27middle%27%20fill%3D%27%231b1d24%27%20font-family%3D%27Noto%20Serif%2C%20Georgia%2C%20Times%20New%20Roman%2C%20serif%27%20font-style%3D%27italic%27%20%3ENote%3A%20Figure%20not%20drawn%20to%20scale.%3C/text%3E%3C/svg%3E"},{"text":"$$45z^{10}+bz^5+26$$ In the given expression, $b$ is a positive integer. If $qz^5+r$ is a factor of the expression, where $q$ and $r$ are positive integers, what is the greatest possible value of $b$?","type":"spr","answer":["1171"]},{"text":"$$f(x)=-2x^2+24x+c$$ In the given function, $c$ is a constant. If $f(2)=f(k)$, where $k$ is a constant and $k\\ne 2$, what is the value of $k$?","type":"spr","answer":["10"]},{"text":"A certain savings account offers a special interest rate for the first 5 months the account is open, followed by a lower interest rate for the remainder of the time the account is open. Dilshod opened one of these accounts with an original account balance of $\\$1{,}250.00$ and did not make any other deposits or withdrawals. Five months after Dilshod opened the account, the balance had increased by 0.8% of the original balance. Eight months after Dilshod opened the account, the balance had increased by an additional 0.2% of the balance at the end of the first 5 months. Every 3 months after the first 8 months, the balance increased by an additional 0.2% of the balance 3 months before. Which of the following equations could represent the account balance $B(x)$, in dollars, $x$ months after the account was opened, where $x\\ge 5$?","type":"mc","choices":["$B(x)=1{,}260.00(1.002)^{\\frac{x-5}{3}}$","$B(x)=1{,}250.00(1.002)^{\\frac{x-5}{3}}$","$B(x)=1{,}260.00(1.002)^{3(x-5)}$","$B(x)=1{,}250.00(1.002)^{3(x-5)}$"],"answer":"A"},{"text":"The figure shows a hemispherical bowl made of glass. The bowl is 15 centimeters high, and the glass is 3 centimeters thick everywhere. When function start(i){NAME=(($('#nm')||{}).value||NAME).trim();try{localStorage.setItem('satName',NAME)}catch(e){}Z=1;const t=TESTS[i];S={t,m:0,i:0,ans:t.modules.map(m=>m.map(()=>({}))),flag:t.modules.map(m=>m.map(()=>false)),left:t.time||2100,hide:false};popOpen=false;runTimer();render()}
function runTimer(){clearInterval(timer);timer=setInterval(()=>{S.left--;save();const e=$("#tm");if(e){e.textContent=S.hide?"":fmt(S.left);e.parentNode.classList.toggle("low",S.left<=300)}if(S.left<=0)finishModule()},1000)}
function Q(){return S.t.modules[S.m][S.i]}
function A(){return S.ans[S.m][S.i]}
function shell(inner,foot){const cc=document.body.classList.contains('cc');return `<header class="top"><div class="sec"><b>Section 2, Module ${S.m+1}: Math</b><button class="tool" onclick="dirs()">Directions ⌄</button></div>
 <div class="timer ${S.left<=300?"low":""}"><span id="tm">${S.hide?"":fmt(S.left)}</span><button class="hide" onclick="S.hide=!S.hide;render()">${S.hide?"Show":"Hide"}</button></div>
 <div class="tools"><button class="tool ${cc?"on":""}" onclick="toggleCalc()">${IC.calc}Calculator</button><button class="tool ${document.getElementById('refo')?"on":""}" onclick="refSheet()">${IC.ref}Reference</button><button class="tool" onclick="more()">${IC.more}More</button></div></header>${inner}${foot}`}

function render(){if(!S)return;save();const q=Q(),a=A(),n=S.t.modules[S.m].length;document.body.classList.add('intest');
 let body;
 if(q.type==="spr"){body=`<div class="sprbox"><div><input class="spr" id="spr" value="${esc(a.v||"")}" maxlength="6" autocomplete="off" oninput="sprIn(this)"></div><div class="prev">Answer Preview:<div id="pv"></div></div></div><p class="hint">Enter a number, decimal or fraction (e.g. 3/4, -2.5). Up to 5 characters, 6 if negative.</p>`}
 else body=`<div class="chs">${q.choices.map((c,k)=>{const L="ABCD"[k],el=(a.el||[]).includes(L);return `<div class="chrow"><div class="ch ${a.v===L?"sel":""} ${el?"el":""}" onclick="pick('${L}')"><span class="L">${L}</span><span class="t">${c}</span></div>${el?`<button class="x u" onclick="elim('${L}')">Undo</button>`:S.abc?`<button class="x" title="Cross out ${L}" onclick="elim('${L}')">${L}</button>`:""}</div>`}).join("")}</div>`;
 $("#app").innerHTML=shell(`<main class="q"><div class="qin"><div class="qhead"><span class="num">${S.i+1}</span>
 <button class="flag" onclick="S.flag[S.m][S.i]=!S.flag[S.m][S.i];render()">${BM(S.flag[S.m][S.i])} Mark for Review</button>${EDITMODE?`<button class="edq" title="Edit this question" onclick="openEditor(TESTS.indexOf(S.t),S.m,S.i)">✎ Edit</button>`:""}<button class="abc ${S.abc?"on":""}" title="Cross out answer choices" onclick="S.abc=!S.abc;render()">ABC</button></div>
 <div class="qtext">${q.img?fig(q.img,q.imgw):""}${q.text||""}</div>${body}</div></main>`,
 `<footer class="nav"><span class="who">${esc(NAME||S.t.title)}</span><button class="pill" onclick="popOpen=!popOpen;render()">Question ${S.i+1} of ${n} <span style="font-size:11px">${popOpen?"▼":"▲"}</span></button>
 <span class="r"><button class="btn" ${S.i===0?"disabled":""} onclick="go(S.i-1)">Back</button><button class="btn" onclick="${S.i<n-1?"go(S.i+1)":"review()"}">Next</button></span></footer>
 ${popOpen?navPop(n,true):""}`);tex($("#app"));if(q.type==="spr")prev(a.v||"")}
function sprIn(el){let v=el.value.replace(/[^0-9.\/\-]/g,"");const lim=v.startsWith("-")?6:5;v=v.slice(0,lim);el.value=v;A().v=v;prev(v)}
function prev(v){const p=$("#pv");if(!p)return;if(!v){p.innerHTML="";return}let t=esc(v);const m=v.match(/^(-?)([^\/]*)\/(.*)$/);if(m)t=`${m[1]}\\frac{${esc(m[2])}}{${esc(m[3])}}`;if(window.katex){try{p.innerHTML=katex.renderToString(t,{throwOnError:false})}catch(e){p.textContent=v}}else p.textContent=v}
function navPop(n,cur){return `<div class="pop"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b>Section 2, Module ${S.m+1}: Math Questions</b><button style="background:none;border:0;font-size:20px" onclick="popOpen=false;render()">✕</button></div><div class="lg"><span>📍 Current</span><span>⬚ Unanswered</span><span style="color:var(--bad)">■ For Review</span></div><div class="grid">${S.ans[S.m].map((a,k)=>`<button class="g ${a.v?"done":""} ${cur&&k===S.i?"cur":""} ${S.flag[S.m][k]?"f":""}" onclick="go(${k})">${k+1}</button>`).join("")}</div><div style="text-align:center"><button class="btn o" onclick="review()">Go to Review Page</button></div></div>`}
function pick(L){const a=A();if((a.el||[]).includes(L))return;a.v=a.v===L?a.v:L;render()}
function elim(L){const a=A();a.el=a.el||[];const i=a.el.indexOf(L);if(i<0){a.el.push(L);if(a.v===L)a.v=""}else a.el.splice(i,1);render()}

function num(s){s=String(s).replace(/\s/g,"");if(/^-?\d*\.?\d+\/-?\d*\.?\d+$/.test(s)){const[a,b]=s.split("/");return a/b}const v=Number(s);return s===""?NaN:v}
function ok(q,a){if(!a.v)return false;if(q.type!=="spr")return a.v===q.answer;const u=num(a.v.replace(/,/g,''));return [].concat(q.answer).some(c=>String(c).replace(/\s/g,"")===a.v.replace(/\s/g,"")||(!isNaN(u)&&Math.abs(num(c)-u)<1e-9))}

 <p style="margin-top:18px"><button class="btn" onclick="home()">Back to tests</button></p></div></div>`}

/* Desmos without an API key: the official desmos.com pages in iframes (created once, kept alive so work isn't lost) */
const DURL=["https://www.desmos.com/calculator","https://www.desmos.com/scientific"];
function dframe(t){const box=t?$("#dsci"):$("#dc");if(!box.querySelector("iframe")){box.innerHTML=`<div class="load">Loading Desmos…</div>`;const f=document.createElement("iframe");f.src=DURL[t];f.title=t?"Desmos Scientific Calculator":"Desmos Graphing Calculator";f.allow="clipboard-read; clipboard-write; fullscreen";f.style.cssText="width:100%;height:100%;border:0;display:block";f.onload=()=>{const l=box.querySelector(".load");if(l)l.remove()};box.appendChild(f)}}
function calcTab(t){tab=t;$("#dc").style.display=t?"none":"block";$("#dsci").style.display=t?"block":"none";$("#tg").className=t?"":"on";$("#ts").className=t?"on":"";dframe(t)}
function setRef(){const b=document.querySelectorAll(".tools .tool");if(b[1])b[1].classList.toggle("on",!!document.getElementById("refo"))}
function setTools(){const b=document.querySelectorAll('.tools .tool');if(b[0])b[0].classList.toggle('on',document.body.classList.contains('cc'))}
function closeCalc(){document.body.classList.remove("cc");setTools()}
function toggleCalc(){if(document.body.classList.contains("cc"))return closeCalc();if(innerWidth<=680)closeRef();document.body.classList.add("cc");setCW(panelW('desmos')||Math.min(innerWidth*.42,580));setTools();dframe(tab)}
/* ---- panel sizing: Desmos (left) + Reference (right), Bluebook style ---- */
const RS=document.documentElement.style,px=v=>Math.round(v)+'px';
const MINQ=360;            // keep at least this much room for the question
const availH=()=>innerHeight-parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hh'))-parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fh'));
const panelW=id=>{const e=document.getElementById(id);return e&&getComputedStyle(e).display!=='none'?e.getBoundingClientRect().width:0};
const isFl=()=>document.body.classList.contains('cfl');
function setCW(w){if(isFl()){const l=$('#desmos').getBoundingClientRect().left;w=Math.max(300,Math.min(innerWidth-l-4,w))}else{const other=document.body.classList.contains('rr')?panelW('refo'):0;w=Math.max(300,Math.min(innerWidth-other-MINQ,w))}RS.setProperty('--cw',px(w))}
function setRW(w){const other=document.body.classList.contains('cc')?panelW('desmos'):0;w=Math.max(300,Math.min(innerWidth-other-MINQ,w));RS.setProperty('--rw',px(w))}
function setH(v,h){let mx=availH();if(v==='--ch'&&isFl())mx=innerHeight-$('#desmos').getBoundingClientRect().top-parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fh'));h=Math.max(260,Math.min(mx,h));if(v==='--ch'&&isFl()){RS.setProperty(v,px(h));return}RS.setProperty(v,h>=availH()-2?'':px(h));if(h>=availH()-2)RS.removeProperty(v)}
function calcDock(){document.body.classList.remove('cfl');RS.removeProperty('--cx');RS.removeProperty('--cy')}
function calcExpand(){if(!$("#exb"))return;calcDock();wide=!wide;RS.removeProperty('--ch');setCW(wide?innerWidth*.66:Math.min(innerWidth*.42,580));$("#exb").textContent=wide?"⤡":"⤢";$("#exb").title=wide?"Collapse":"Expand"}
let rwide=false;
function refExpand(){rwide=!rwide;RS.removeProperty('--rh');setRW(rwide?innerWidth*.62:Math.min(innerWidth*.4,520));const b=$("#rexb");if(b){b.textContent=rwide?"⤡":"⤢";b.title=rwide?"Collapse":"Expand"}}
function dragger(h,cls,move){h.addEventListener('pointerdown',e=>{if(innerWidth<=680)return;e.preventDefault();document.body.classList.add('drag',cls);h.setPointerCapture(e.pointerId);
 const mv=ev=>move(ev);const up=()=>{document.body.classList.remove('drag',cls);h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);calc&&calc.resize();sci&&sci.resize()};
 h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up)})}
const topY=()=>document.querySelector('header.top')?document.querySelector('header.top').getBoundingClientRect().bottom:76;
const dR=()=>$('#desmos').getBoundingClientRect();
dragger($('#drs'),'dragx',ev=>setCW(ev.clientX-dR().left));
dragger($('#dcr'),'dragc',ev=>{const r=dR();setCW(ev.clientX-r.left);setH('--ch',ev.clientY-r.top)});

async function compressImg(file){if(file.type==='image/svg+xml'){const t=await file.text();return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(t)}
