<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital SAT Math Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{--fg:#1b1d24;--mut:#666b78;--line:#dde1ea;--pri:#3054d4;--pri2:#2240b3;--sel:#edf2ff;--bad:#d64545;--ok:#1f9d55;--hdr:#f2f5fb;--hh:76px;--fh:68px;--cw:min(42vw,580px)}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.55 Inter,system-ui,"Segoe UI",Arial,sans-serif;color:var(--fg);background:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
.btn{background:var(--pri);color:#fff;border:0;border-radius:999px;padding:9px 24px;font-weight:600;transition:background .15s,transform .05s}
.btn:hover{background:var(--pri2)}.btn:active{transform:translateY(1px)}
.btn.o{background:#fff;color:var(--pri);box-shadow:inset 0 0 0 1.5px var(--pri)}.btn.o:hover{background:var(--sel)}
.btn:disabled{opacity:.35;cursor:default}

/* ---------- home ---------- */
.home{min-height:100vh;background:radial-gradient(1200px 500px at 10% -10%,#dfe7ff 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#e6f4ff 0,transparent 55%),#f7f8fc}
.wrap{max-width:780px;margin:0 auto;padding:48px 22px 60px}
.brand{display:flex;align-items:center;gap:12px;color:var(--pri);font-weight:700;letter-spacing:.02em;font-size:14px;text-transform:uppercase}
.brand i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3a63f0,#1b2f8f);display:grid;place-items:center;color:#fff;font-style:normal;font-size:17px}
.home h1{font-size:40px;line-height:1.15;margin:14px 0 8px;letter-spacing:-.02em}
.home .sub{color:var(--mut);margin:0 0 26px;font-size:17px}
.name{display:flex;gap:10px;align-items:center;margin-bottom:22px}
.name input{font:inherit;font-size:17px;padding:11px 16px;border:1.5px solid var(--line);border-radius:12px;width:300px;max-width:100%;background:#fff;outline:none}
.name input:focus{border-color:var(--pri);box-shadow:0 0 0 4px #3054d420}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;gap:14px;box-shadow:0 1px 2px #0000000a,0 6px 20px -12px #1b2f8f33;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 1px 2px #0000000a,0 14px 30px -14px #1b2f8f55}
.card .ic{width:48px;height:48px;border-radius:12px;background:var(--sel);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.card .meta{flex:1}.card .meta b{font-size:17px}.card small{color:var(--mut)}
.card.res{background:linear-gradient(90deg,#edf2ff,#fff)}
.chip{display:inline-block;background:#eef1f7;border-radius:999px;padding:1px 9px;font-size:12px;color:var(--mut);margin-right:6px;font-weight:600}

/* ---------- test shell ---------- */
header.top{position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:60;background:var(--hdr);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px}
header.top::after,footer.nav::before{content:"";position:absolute;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,#1b1d24 0 14px,transparent 14px 20px)}
header.top::after{bottom:0}footer.nav::before{top:0}
.sec b{font-size:19px;display:block;line-height:1.2}.sec .tool{padding:2px 0;font-size:14px;color:var(--fg);font-weight:500}
.timer{text-align:center}.timer #tm{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;display:block;min-height:30px}
.timer.low #tm{color:var(--bad)}
.timer .hide{border:1.5px solid var(--fg);border-radius:999px;background:#fff;padding:0 14px;font-weight:600;font-size:13px}
.tools{display:flex;gap:4px;justify-content:flex-end}
.tool{background:none;border:0;padding:4px 10px;border-radius:10px}
.tools .tool{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:13px;font-weight:500;min-width:74px}
.tools .tool svg{width:24px;height:24px}
.tools .tool:hover{background:#e2e8f5}.tools .tool.on{background:#dfe6fa;color:var(--pri2)}
main.q{padding:calc(var(--hh) + 26px) 28px calc(var(--fh) + 40px);transition:margin-left .25s ease}
.qin{max-width:800px;margin:0 auto}
.qhead{display:flex;align-items:center;gap:14px;background:#f0f2f7;height:44px;padding-right:10px;position:relative;margin-bottom:22px}
.qhead::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:repeating-linear-gradient(90deg,#1b1d24 0 10px,transparent 10px 15px)}
.num{background:var(--fg);color:#fff;height:100%;min-width:44px;display:grid;place-items:center;font-weight:700;font-size:17px}
.flag{background:none;border:0;display:flex;align-items:center;gap:7px;font-size:15px;font-weight:500;padding:4px 6px;border-radius:6px}.flag:hover{background:#e3e7f0}
.abc{margin-left:auto;border:0;border-radius:6px;padding:2px 8px;font-weight:700;font-size:14px;text-decoration:line-through;background:#fff;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--fg)}
.abc.on{background:var(--pri);color:#fff;box-shadow:none}
.qtext{font-family:"Noto Serif",Georgia,"Times New Roman",serif;font-size:19px;line-height:1.65;margin-bottom:22px}
.qtext .katex-display{margin:.55em 0}
.qtext .rn{margin:10px 0 4px 6px}
table.dt{border-collapse:collapse;margin:4px auto 16px;font-size:18px}
table.dt th,table.dt td{border:1.5px solid #3b82c4;padding:7px 18px;text-align:center}
table.dt th{background:#eaf4fc;font-weight:600}
.qtext table:not(.dt){border-collapse:collapse;margin:8px 0}.qtext table:not(.dt) td,.qtext table:not(.dt) th{border:1px solid var(--line);padding:5px 12px}
.chs{display:flex;flex-direction:column;gap:12px}
.chrow{display:flex;align-items:center;gap:10px}
.ch{flex:1;display:flex;align-items:center;gap:14px;border:1.5px solid #8b8f9a;border-radius:10px;padding:11px 16px;cursor:pointer;background:#fff;transition:border-color .12s,background .12s,box-shadow .12s;position:relative}
.ch:hover{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.ch.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri);background:var(--sel)}
.ch .t{flex:1;font-family:"Noto Serif",Georgia,serif;font-size:18px}
.L{width:30px;height:30px;border-radius:50%;border:1.8px solid var(--fg);display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.ch.sel .L{background:var(--pri);color:#fff;border-color:var(--pri)}
.ch.el{opacity:.55}.ch.el::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;background:var(--fg)}
.x{background:none;border:1.5px solid var(--fg);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.x.u{width:auto;border:0;text-decoration:underline;font-weight:600;font-size:14px}
.sprbox{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
input.spr{font:600 22px Inter,sans-serif;padding:10px 16px;border:0;border-bottom:2.5px solid var(--fg);border-radius:8px 8px 0 0;width:210px;background:#f4f6fa;outline:none}
input.spr:focus{border-color:var(--pri);background:var(--sel)}
.prev{color:var(--mut);font-size:14px}.prev div{font-size:22px;color:var(--fg);min-height:34px}
.hint{color:var(--mut);font-size:14px;margin-top:14px}
footer.nav{position:fixed;left:0;right:0;bottom:0;height:var(--fh);z-index:60;background:var(--hdr);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px}
footer.nav .who{font-size:18px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
footer.nav .r{justify-self:end;display:flex;gap:10px}
.pill{background:var(--fg);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:600;display:flex;align-items:center;gap:8px}
.pop{position:fixed;left:50%;bottom:calc(var(--fh) + 12px);transform:translateX(-50%);width:min(580px,94vw);background:#fff;border-radius:16px;box-shadow:0 20px 60px -10px #0005,0 0 0 1px #0001;padding:20px 22px;z-index:70;animation:up .18s ease}
.pop::after{content:"";position:absolute;left:50%;bottom:-8px;width:16px;height:16px;background:#fff;transform:translateX(-50%) rotate(45deg)}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
.pop .lg{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--mut);padding-bottom:10px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:12px;margin:14px 0}
.g{height:44px;border:1.5px dashed #8b8f9a;background:#fff;color:var(--pri);border-radius:6px;position:relative;font-weight:700}
.g.done{border:0;background:var(--pri);color:#fff}.g.cur::before{content:"📍";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:13px}
.g.f::after{content:"";position:absolute;top:-6px;right:-6px;width:14px;height:16px;background:var(--bad);clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.ok{color:var(--ok)}.bad{color:var(--bad)}

/* figure */
.fig{max-width:620px;margin:0 auto 18px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.zb{display:flex;gap:6px;justify-content:center;align-items:center;background:#f6f7fa;padding:5px;border-bottom:1px solid var(--line)}
.zb button{background:none;border:0;font-size:15px;padding:3px 10px;border-radius:6px}.zb button:hover{background:#e6e9f1}
.zb span{font:600 13px Inter;color:var(--mut);min-width:44px;text-align:center}
.zv{overflow:auto;max-height:460px;text-align:center;padding:10px}
.zv img{height:auto}

/* ---------- calculator (Bluebook style: docked left, question slides right) ---------- */
#desmos{position:fixed;left:0;top:var(--hh);bottom:var(--fh);width:var(--cw);background:#fff;z-index:50;display:none;flex-direction:column;box-shadow:6px 0 24px -12px #0004;animation:slide .22s ease}
@keyframes slide{from{transform:translateX(-30px);opacity:0}}
body.cc #desmos{display:flex}
body.cc main.q{margin-left:var(--cw)}
#dh{background:#1b1d24;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;flex:none}
#dh .ttl{font-weight:700;margin-right:4px}
.ct{display:flex;background:#33363f;border-radius:9px;padding:3px}
.ct button{border:0;border-radius:7px;padding:4px 12px;font-weight:600;font-size:14px;background:none;color:#cfd2da}
.ct .on{background:#fff;color:#111}
#dh .sp{flex:1}
#dh .ib{background:none;border:0;color:#fff;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:18px}
#dh .ib:hover{background:#ffffff22}
#dh .cx{font-size:22px}
#dc,#dsci{flex:1;min-height:0}
#drs{position:absolute;top:0;bottom:0;right:-7px;width:14px;cursor:ew-resize;z-index:2;display:grid;place-items:center}
#drs::before{content:"";width:4px;height:100%;background:#1b1d24}
#drs i{position:absolute;width:14px;height:46px;background:#1b1d24;border-radius:7px;display:grid;place-items:center}
#drs i::after{content:"";width:2px;height:22px;border-left:1.5px solid #fff;border-right:1.5px solid #fff;width:4px}
body.drag,body.drag *{cursor:ew-resize!important;user-select:none}
body.drag #dc,body.drag #dsci{pointer-events:none}
.load{display:grid;place-items:center;height:100%;color:var(--mut)}

/* reference */
#refo{position:fixed;right:0;top:var(--hh);bottom:var(--fh);width:min(560px,100vw);background:#fff;z-index:55;display:flex;flex-direction:column;box-shadow:-8px 0 30px -12px #0005;animation:sr .2s ease}
@keyframes sr{from{transform:translateX(30px);opacity:0}}
.rb{background:#1b1d24;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:10px 16px;font-size:17px}
.rb button{background:none;border:0;color:#fff;font-size:22px}
.rb .ra{display:flex;align-items:center;gap:6px}
.rb .ra button{width:38px;height:38px;border-radius:8px;display:grid;place-items:center;line-height:1}
.rb .ra button:hover{background:#ffffff24}
.rb .ra button:focus-visible{outline:2px solid #fff;outline-offset:1px}
.rb svg{width:22px;height:22px}
#refo{transition:width .22s ease}
#refo.wide{width:min(80vw,1100px)}
body.cc #refo.wide{width:max(560px,calc(100vw - var(--cw)))}
#refo .zb{background:#f2f4f9;flex:none}
#refo .zb button{min-width:36px}
#refo .rv{flex:1;min-height:0;overflow:auto;padding:16px;background:#fff}
#refo .rv img{display:block;margin:0 auto;max-width:none;height:auto}
@media(max-width:680px){#refo .rx{display:none}}

/* modal */
.mask{position:fixed;inset:0;background:#10142a66;backdrop-filter:blur(2px);display:grid;place-items:center;z-index:90;animation:fd .15s}
@keyframes fd{from{opacity:0}}
.mask>div{background:#fff;padding:26px 28px;border-radius:18px;max-width:440px;box-shadow:0 30px 80px -20px #0007}
.mask h3{margin:0 0 6px}

/* review & results */
.page{min-height:100vh;background:#f7f8fc;padding:calc(var(--hh) + 30px) 20px 60px}
.panel{background:#fff;border-radius:18px;border:1px solid var(--line);padding:26px;max-width:760px;margin:0 auto 18px;box-shadow:0 10px 30px -18px #1b2f8f40}
.score{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--pri) calc(var(--p)*1%),#e7ebf5 0)}
.ring div{width:120px;height:120px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font-size:38px;color:var(--pri)}.ring small{color:var(--mut);font-size:12px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.stats span{background:#f2f4f9;border-radius:10px;padding:6px 12px;font-size:14px}
table.rt{border-collapse:collapse;width:100%;font-size:15px}
table.rt td,table.rt th{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left}
table.rt tr.r:hover{background:#f6f8fd;cursor:pointer}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-weight:700;font-size:13px}.tag.ok{background:#e6f6ec}.tag.bad{background:#fdeaea}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{border:0;background:#eef1f7;border-radius:999px;padding:6px 16px;font-weight:600}.tabs .on{background:var(--fg);color:#fff}

@media(max-width:900px){:root{--cw:min(48vw,460px)}.tools .tool{min-width:54px;font-size:12px}}
@media(max-width:680px){
 :root{--hh:64px;--fh:62px}
 header.top{padding:0 10px}.sec b{font-size:15px}.timer #tm{font-size:19px}.tools .tool{min-width:44px;font-size:0;padding:4px 6px}
 footer.nav{padding:0 10px}footer.nav .who{display:none}footer.nav{grid-template-columns:auto 1fr}footer.nav .pill{justify-self:start}
 main.q{padding-left:16px;padding-right:16px}
 #desmos{width:100%!important;top:auto;height:58vh;border-radius:16px 16px 0 0;overflow:hidden}
 body.cc main.q{margin-left:0;padding-bottom:calc(58vh + var(--fh) + 20px)}
 #drs{display:none}#dh .ex{display:none}
 .home h1{font-size:30px}.score{grid-template-columns:1fr;justify-items:center}
}
</style></head><body>
<div id="app"></div>
<div id="desmos"><div id="dh"><span class="ttl">Calculator</span><div class="ct"><button id="tg" class="on" onclick="calcTab(0)">Graphing</button><button id="ts" onclick="calcTab(1)">Scientific</button></div><span class="sp"></span><button class="ib ex" id="exb" title="Expand / collapse" onclick="calcExpand()">⤢</button><button class="ib cx" title="Close calculator" onclick="closeCalc()">✕</button></div><div id="dc"><div class="load">Loading Desmos…</div></div><div id="dsci" style="display:none"></div><div id="drs" title="Drag to resize"><i></i></div></div>

imeters (mm). Circle $N$ has an area of $144\\pi$ mm$^2$. The radius of circle $P$ is equal to the difference of the radius of circle $N$ and the radius of circle $M$. What is the total area, in mm$^2$, of circles $M$, $N$, and $P$?", "type": "mc", "choices": ["$193\\pi$", "$218\\pi$", "$288\\pi$", "$344\\pi$"], "answer": "B"}, {"text": "$$-\\frac1{12}rx+\\frac56=9-\\frac34x$$ In the given equation, $r$ is a constant. The equation has no solution. What is the value of $r$?", "type": "spr", "answer": ["9"]}, {"text": "$$-6x(x+8)=18$$ One solution to the given equation can be written as $z-\\frac a2\\sqrt b$, where $z$, $a$, and $b$ are integers and $a$ and $b$ are positive. What is the value of $\\frac ab$?", "type": "mc", "choices": ["$\\frac1{26}$", "$\\frac2{13}$", "$\\frac4{13}$", "$\\frac{13}2$"], "answer": "B"}, {"text": "$$17(x-c)=17y+17c$$ One of the equations in a system of two linear equations is given, where $c$ is a positive constant. The system has no solution. Which equation could be the second equation in this system?", "type": "mc", "choices": ["$3x-3y=6c$", "$3x+3y=6c$", "$3x-3y=3c$", "$3x+3y=3c$"], "answer": "C"}, {"text": "$$(x-m)^2=(m-6a)(x-m)$$ In the given equation, $a$ and $m$ are constants, where $m>6a$. The sum of the solutions to the equation is $3m+48$. What is the value of $a$?", "type": "spr", "answer": ["-8"]}, {"text": "The function $p$ is defined by $p(x)=a\\big((x+7)^2-b\\big)\\big((x+7)^2+c\\big)$, where $a$, $b$, and $c$ are constants. In the $xy$-plane, the graph of $y=p(x)$ passes through the points $(-9,44)$ and $(0,517)$. What is the value of $p(-5)+p(-14)$?", "type": "spr", "answer": ["561"]}, {"text": "A quadratic function models the height, in feet, of a projectile above the ground in terms of the time, in seconds, after the projectile was launched. According to the model, the projectile was launched from a height of 0 feet and reached its maximum height of 2,025 feet, 9 seconds after it was launched. Based on the model, what was the height, in feet, of the projectile 5 seconds after it was launched?", "type": "spr", "answer": ["1625"]}, {"text": "The equation $N(m)=80(Q)^{m/4}$ gives the predicted population $N(m)$, in thousands, of a bacteria colony $m$ minutes after the initial measurement, where $Q$ is a constant greater than 1. The predicted population increases by $p\\%$ every 240 seconds. What is the value of $p$ in terms of $Q$?", "type": "mc", "choices": ["$100(Q-1)$", "$100(Q+1)$", "$100(Q^4-1)$", "$100(Q^{1/4}-1)$"], "answer": "A"}]]}, {"id": 11, "title": "SAT Practice Test 11", "time": 2100, "modules": [[{"text": "The function $v$ models the volume, in liters, of water remaining in a tank $x$ minutes after the tank began draining. The graph of $y=v(x)$ is shown. According to the model, what was the volume, in liters, of water remaining in the tank 6 minutes after the tank began draining?", "type": "mc", "choices": ["5", "15", "30", "45"], "answer": "B", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAiMAAAGBCAIAAAA7dCaeAABGi0lEQVR42u3deVzU1f4/8DPDrAzLMAwMmywii2yCqGiQiopUaJEmWrbhkl8ls19mlMute7tey26U18xMEyu3JLPQVLwmlYQgIosii6yyb4IwMBvM/P74GI7DctGAGWZez4d/yJkPM3MOn5nXnM/nzPtDU6lUBAAAYNjQMQQAAICkAQAAJA0AAACSBgAAtIKhNz2pr69///33e7eHhoYuXLhQozExMXH//v3l5eVWVlYLFix45ZVXjIyMsDcAACBpBtLS0rJr164+eshgaCRNbGzsxx9/vG3btn/961+5ubkxMTE//fTTqVOnGAwGdggAACTNQJycnIqLizUa6fT7jhCeOXNm+/btGzdu3LBhAyHEy8uLzWYvWLBg27ZtW7ZswQ4BADDkaHrzfZqCgoLHHnusvLx84M1CQkL++OOPyspKBwcHqkWlUjk4OHR2dtbX17NYLOwTAABDy7BWBDQ2Nqampjo7O/fEDCGERqOFhIS0trYmJydjhwAAGHL6dmaitrY2KSmptrbW1NQ0KCho8uTJ6rfm5OSoVCpXV1eN36JasrOzw8PDsU8AAGBO06+ampqAgIBLly4pFIpLly4FBwc/+uijVVVVPRtUVlYSQoRCocYvWllZEULUtwQAAMxpNBkbG4eHh3/55Ze2trZUy7Jly+bMmfPYY49dvXqVOgHT0dFBCGGz2Rq/S7WIxeLBPFDvKREAgOEoKSkx3DmNo6PjyZMne2KGEDJ79uyIiIi8vLyjR49SLUwmkxDS1dWl8btUC5YDAAAMBz1fETB16lRCyMWLF6kfLS0t+5y7UC0CgQA7BADAkNPz7ypSp2Tu3LlD/ejp6Un6Oh9Dnb+hbh3WKeSQOJBSSgh5OWSstkZVu08A3Uf30X2tPPpfOXGgP3Oazz77LDs7W6ORCpWeQ2peXl4ikejGjRsKhUJ9s6ysLEJIaGgoPnoAAAw5/UmaAwc rgin:8px 0'><tr><th>Value<\/th><th>Set A<\/th><th>Set B<\/th><th>Set C<\/th><th>Set D<\/th><\/tr><tr><td>5<\/td><td>9<\/td><td>8<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>15<\/td><td>6<\/td><td>5<\/td><td>3<\/td><td>2<\/td><\/tr><tr><td>25<\/td><td>4<\/td><td>5<\/td><td>5<\/td><td>4<\/td><\/tr><tr><td>35<\/td><td>2<\/td><td>3<\/td><td>5<\/td><td>6<\/td><\/tr><tr><td>45<\/td><td>0<\/td><td>0<\/td><td>8<\/td><td>9<\/td><\/tr><\/table>", "type": "mc", "choices": ["Data set A", "Data set B", "Data set C", "Data set D"], "answer": "D"}, {"text": "Which expression is a factor of $x^4+18bx^2+81b^2-25$, where $b$ is a positive constant?", "type": "mc", "choices": ["$x^2+9b-5$", "$x^2-9b+5$", "$x^2+18b$", "$x^2-5b$"], "answer": "A"}, {"text": "On January 1, 1995, a company had 4,318 employees, and on January 1, 2015, the company had 5,058 employees. The equation $20x+4{,}318=5{,}058$ describes this situation. Which is the best interpretation of $x$ in this context?", "type": "mc", "choices": ["The total increase in the number of employees between 1995 and 2015", "The number of employees the company is projected to have in 2035", "The average increase per year in the number of employees between 1995 and 2015", "The percentage by which the number of employees increased each year between 1995 and 2015"], "answer": "C"}, {"text": "The function $f$ is defined by $f(x)=x^3+5x^2-9x-63$. In the $xy$-plane, the graph of $y=h(x)$ is the result of translating the graph of $y=f(x)$ right 2 units and up 11 units. What is the $y$-coordinate of the $y$-intercept of the graph of $y=h(x)$?", "type": "spr", "answer": ["-22"]}, {"text": "In the $xy$-plane, an equation of circle $A$ is $x^2+y^2+10x-6y-2=0$. Circle $B$ has the same center as circle $A$ and a radius that is 3 times the radius of circle $A$. Which equation represents circle $B$?", "type": "mc", "choices": ["$(x+5)^2+(y-3)^2=108$", "$(x+5)^2+(y-3)^2=324$", "$(x-5)^2+(y+3)^2=324$", "$(x+5)^2+(y-3)^2=18$"], "answer": "B"}, {"text": "A \right)(180)(3)$", "$\\left(\\frac7{15\\pi}\\right)(90)(3)$", "$\\left(\\frac{7\\pi}{15}\\right)(180)(3)$"], "answer": "B"}, {"text": "In $\\triangle JKL$, $JK=KL$ and the measure of angle $K$ is $38^\\circ$. What is the measure of angle $J$?", "type": "mc", "choices": ["$19^\\circ$", "$38^\\circ$", "$71^\\circ$", "$142^\\circ$"], "answer": "C"}, {"text": "What is the $x$-intercept of the graph of $y=\\frac{28-x}{cx+d}$ in the $xy$-plane, where $c$ and $d$ are positive constants?", "type": "mc", "choices": ["$\\left(-\\frac dc,0\\right)$", "$\\left(0,\\frac{28}{d}\\right)$", "$(0,-28)$", "$(28,0)$"], "answer": "D"}, {"text": "$$2x+5y=43$$ $$6x-ky=-25$$ In the given system of equations, $k$ is a constant. The solution to the system is $(x,y)$, where $x=4$. What is the value of $k$?", "type": "spr", "answer": ["7"]}, {"text": "$$D=\\frac{0.75(h-8)}{2w}$$ The given equation relates the density $D$ of a beam to its height $h$, in centimeters, and its width $w$, in centimeters. Which equation correctly expresses the height of the beam in terms of its density and its width?", "type": "mc", "choices": ["$h=\\frac{2wD}{0.75}-8$", "$h=\\frac{2wD}{0.75}+8$", "$h=\\frac{0.75wD}{2}+8$", "$h=\\frac{2wD+8}{0.75}$"], "answer": "B"}, {"text": "For the polynomial function $g$, the graph of $y=g(x)$ in the $xy$-plane passes through the points $(-8,0)$, $(2,0)$, and $(11,0)$. Which of the following must be a factor of $g(x)$?", "type": "mc", "choices": ["$x+2$", "$x-8$", "$x-11$", "$x+11$"], "answer": "C"}, {"text": "$$f(x)=3^{-4(x+2)}$$ Which of the following equivalent forms of the given function $f$ displays, as the base or the coefficient, the $y$-coordinate of the $y$-intercept of the graph of $y=f(x)$ in the $xy$-plane?", "type": "mc", "choices": ["$f(x)=\\frac1{6{,}561}\\left(\\frac13\\right)^{4x}$", "$f(x)=\\left(\\frac13\\right)^{4x+8}$", "$f(x)=3^{-4x-8}$", "$f(x)=6{,}561^{-x-2}$"], "answer": "A"}, {"text": "In the $xy$-plane, line $k$ is perpendicular to the line defined by $4x+7y=21$, has an $x$-intercept of $(-8,0)$, and has a $y$-intercept of $(0,p)$. What is the value of $p$?", "type": "spr", "answer": ["14"]}, {"text": "The vertex of a parabola is at $(34,-19)$. If one of the $x$-intercepts is at $x=51$, what is the $x$-coordinate of the second $x$-intercept of the parabola?", "type": "mc", "choices": ["$-17$", "17", "23", "68"], "answer": "B"}, {"text": "The area of a solar panel array is increasing at a rate of 0.45 square meters per second. Which of the following is closest to this rate expressed in square feet per hour? (1 meter = 3.28 feet)", "type": "mc", "choices": ["1,476", "5,313", "17,429", "57,166"], "answer": "C"}, {"text": "The length of a copper wire, in millimeters, is given by $L(T)=0.0045(T-15)+320$, where $T$ is the temperature in degrees Celsius. If the temperature increases by 400 degrees Celsius, by how much does the length of the wire increase, in millimeters?", "type": "mc", "choices": ["1.8", "4.5", "18", "321.8"], "answer": "A"}, {"text": "A quality engineer selected 2 random samples of a certain model of battery to estimate the average number of hours the battery lasts under continuous use. Based on the first sample, the engineer estimated an average of 18.6 hours, with an associated margin of error of 0.8 hour. Based on the second sample, the engineer estimated an average of 18.9 hours, with an associated margin of error of 1.9 hours. Assuming the margins of error were calculated the same way, which best explains why the first sample obtained a smaller margin of error than the second sample?", "type": "mc", "choices": ["The first sample contained fewer batteries than the second sample.", "The first sample contained more batteries than the second sample.", "The batteries in the first sample lasted fewer hours on average than those in the second sample.", "The batteries in the first sample lasted more hours on average than those in the second sample."], "answer": "B"}, {"text": "Which expression is equivalent to $3x^3+15x^2y+2xy^2+10y^3$?", "type": "mc", "choices": ["$(3x^2+10y)(x+y^2)$", "$(3x^2+2y^2)(x+5y)$", "$(3x^3+2y^2)(x^2+5y^3)$", "$(3x^3+2y^3)(x+5y)$"], "answer": "B"}, {"text": "The function $f$ is defined by $f(x)=ab^{x/n}$, where $a$, $b$, and $n$ are constants, and $b$ and $n$ are integers. If $f(4)=5$ and $f(10)=320$, what is the value of $f(13)$?", "type": "mc", "choices": ["640", "1,280", "2,560", "20,480"], "answer": "C"}, {"text": "Data set $M$ consists of 60 integers, where the value of each integer is between 120 and 180. Data set $N$ consists of the same 60 integers in $M$ as well as the integer 940. Which of the following must be greater for data set $N$ than for data set $M$?<br>I. The mean<br>II. The median", "type": "mc", "choices": ["I only", "II only", "I and II", "Neither I nor II"], "answer": "A"}, {"text": "The function $f$ is defined by $f(x)=a^x-b$, where $a$ and $b$ are constants. In the $xy$-plane, the graph of $y=f(x)$ passes through the points $(c,5)$ and $(2c,137)$, where $c$ is a constant. Which of the following could be the value of $b$?", "type": "mc", "choices": ["7", "12", "132", "144"], "answer": "A"}, {"text": "The scatterplot shows data set $A$, which consists of the masses $y$, in grams, of a rabbit kit at various ages $x$, in weeks. The equation of a line of best fit for the relationship in data set $A$ can be written as $y=3.2+10.7x$, where $1\\le x\\le 5$.<br>The rabbit kit was weighed again at 8 weeks old and had a mass of 120 grams. Data set $B$ consists of all the data points in data set $A$ as well as the data point $(8,120)$. The equation of a line of best fit for data set $B$ can be written as $y=r+sx$, where $r$ and $s$ are constants and $1\\le x\\le 8$. Assuming the equations of the lines of best fit are calculated in the same way, which of the following is the best estimate for the value of $s$?", "type": "mc", "choices": ["6.4", "10.7", "14.9", "21.3"], "answer": "C", "img": "data:image/png;base64,iVBORw0KGgoA T}$ each have a length of 10 centimeters, and angles $Q$ and $T$ each have a measure of $52^\\circ$. Which of the following additional pieces of information is/are sufficient to prove whether triangle $PQR$ is congruent to triangle $STU$?<br>I. The measures of angles $P$ and $R$ are equal.<br>II. The lengths of sides $\\overline{PR}$ and $\\overline{SU}$ are equal.<br>III. The lengths of sides $\\overline{QR}$ and $\\overline{TU}$ are equal.", "type": "mc", "choices": ["I is sufficient, but II and III are not.", "II is sufficient, but I and III are not.", "III is sufficient, but I and II are not.", "II is sufficient and III is sufficient, but I is not."], "answer": "C"}, {"text": "$$\\frac79(x+4)\\left(x+\\sqrt{3k+4}\\right)\\left(x-\\sqrt{3k+4}\\right)=0$$ In the given equation, $k$ is a positive constant. The product of the solutions to the equation is 100. What is the value of $k$?", "type": "spr", "answer": ["7"]}, {"text": "A textile inspector is analyzing the tensile strength of 150 fabric samples by measuring the breaking force, in newtons, of each sample. The mean breaking force of all 150 samples is 640 newtons. The inspector classifies each sample as either <i>reinforced<\/i> or <i>standard<\/i>. Of the 150 samples, 60 were classified as reinforced, and these 60 samples have a mean breaking force of 880 newtons. The remaining 90 samples were classified as standard. What is the mean breaking force, in newtons, of the 90 standard samples?", "type": "spr", "answer": ["480"]}, {"text": "$$y=5\\left(\\frac m9\\right)^{x-d}+n$$ How many times does the graph of the given equation in the $xy$-plane cross the $x$-axis, where $m$, $n$, and $d$ are positive constants such that $m\\lt 9$ and $n>d$?", "type": "mc", "choices": ["Zero", "One", "Two", "Three"], "answer": "A"}, {"text": "The expression $15x^4+34x^2+15$ can be rewritten as $(5x^2+a)(3x^2+b)$, where $a$ and $b$ are positive integers, or as $(5x^2+c)(3x^2+d)$, where $c$ and $d$ are positive non-integers. What is the value of $a+c$?", "type": "spr", "answer": ["34/3", "11.33", "11.333", "11.334"]}]]}, {"id": 12, "title": "SAT Practice Test 12", "time": 2100, "modules": [[{"text": "Which expression is equivalent to $(5a^3b^{-2})(4a^{-1}b^5)$, where $a$ and $b$ are positive?", "type": "mc", "choices": ["$9a^2b^3$", "$20a^2b^3$", "$20a^4b^{-7}$", "$20a^{-3}b^{-10}$"], "answer": "B"}, {"text": "If $9p=-6q$, where $q\\ne 0$, what is the value of $\\dfrac{p}{2q}$?", "type": "spr", "answer": ["-1/3", "-.3333", "-0.3333", "-.333", "-0.333"]}, {"text": "Triangles $ABC$ and $DEF$ are similar, where $A$ corresponds to $D$ and $B$ corresponds to $E$. The measures of angles $A$ and $B$ are $34^\\circ$ and $108^\\circ$, respectively. What is the measure of angle $F$?", "type": "mc", "choices": ["$34^\\circ$", "$38^\\circ$", "$72^\\circ$", "$108^\\circ$"], "answer": "B"}, {"text": "$$y=-3x^2+24x-5$$ The given equation relates the variables $x$ and $y$. What is the maximum value of $y$?", "type": "spr", "answer": ["43"]}, {"text": "The box plots summarize the heights, in centimeters, of the plants in group $P$ and the plants in group $Q$. Based on the box plots, which statement must be true?", "type": "mc", "choices": ["The median height of group $P$ is greater than the median height of group $Q$.", "The median height of group $P$ is less than the median height of group $Q$.", "The range of the heights in group $P$ is less than the range of the heights in group $Q$.", "The interquartile range of the heights in group $P$ is less than the interquartile range of the heights in group $Q$."], "answer": "B", "img": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20540%20295%27%20width%3D%27540%27%20height%3D%27295%27%3E%3Crect%20width%3D%27540%27%20height%3D%27295%27%20fill%3D%27white%27/%3E%3Ctext%20x%3D%27275%27%20y%3D%2730%27%20font-size%3D%2716%27%20text-anchor%3D%27middle%27%20%20font-family%3D%27Noto%20Serif%2C%20Georgia%2C%20Ti  <div class="timer ${S.left<=300?"low":""}"><span id="tm">${S.hide?"":fmt(S.left)}</span><button class="hide" onclick="S.hide=!S.hide;render()">${S.hide?"Show":"Hide"}</button></div>
 <div class="tools"><button class="tool ${cc?"on":""}" onclick="toggleCalc()">${IC.calc}Calculator</button><button class="tool ${document.getElementById('refo')?"on":""}" onclick="refSheet()">${IC.ref}Reference</button><button class="tool" onclick="more()">${IC.more}More</button></div></header>${inner}${foot}`}

function render(){if(!S)return;save();const q=Q(),a=A(),n=S.t.modules[S.m].length;document.body.classList.add('intest');
 let body;
 if(q.type==="spr"){body=`<div class="sprbox"><div><input class="spr" id="spr" value="${esc(a.v||"")}" maxlength="6" autocomplete="off" oninput="sprIn(this)"></div><div class="prev">Answer Preview:<div id="pv"></div></div></div><p class="hint">Enter a number, decimal or fraction (e.g. 3/4, -2.5). Up to 5 characters, 6 if negative.</p>`}
 else body=`<div class="chs">${q.choices.map((c,k)=>{const L="ABCD"[k],el=(a.el||[]).includes(L);return `<div class="chrow"><div class="ch ${a.v===L?"sel":""} ${el?"el":""}" onclick="pick('${L}')"><span class="L">${L}</span><span class="t">${c}</span></div>${el?`<button class="x u" onclick="elim('${L}')">Undo</button>`:S.abc?`<button class="x" title="Cross out ${L}" onclick="elim('${L}')">${L}</button>`:""}</div>`}).join("")}</div>`;
 $("#app").innerHTML=shell(`<main class="q"><div class="qin"><div class="qhead"><span class="num">${S.i+1}</span>
 <button class="flag" onclick="S.flag[S.m][S.i]=!S.flag[S.m][S.i];render()">${BM(S.flag[S.m][S.i])} Mark for Review</button><button class="abc ${S.abc?"on":""}" title="Cross out answer choices" onclick="S.abc=!S.abc;render()">ABC</button></div>
 <div class="qtext">${q.img?fig(q.img):""}${q.text||""}</div>${body}</div></main>`,
 `<footer class="nav"><span class="who">${esc(NAME||S.t.title)}</span><button class="pill" onclick="popOpen=!popOpen;render()">Question ${S.i+1} of ${n} <span style="font-size:11px">${popOpen?"▼":"▲"}</span></button>
 <span class="r"><button class="btn" ${S.i===0?"disabled":""} onclick="go(S.i-1)">Back</button><button class="btn" onclick="${S.i<n-1?"go(S.i+1)":"review()"}">Next</button></span></footer>
 ${popOpen?navPop(n,true):""}`);tex($("#app"));if(q.type==="spr")prev(a.v||"")}
function sprIn(el){let v=el.value.replace(/[^0-9.\/\-]/g,"");const lim=v.startsWith("-")?6:5;v=v.slice(0,lim);el.value=v;A().v=v;prev(v)}
function prev(v){const p=$("#pv");if(!p)return;if(!v){p.innerHTML="";return}let t=esc(v);const m=v.match(/^(-?)([^\/]*)\/(.*)$/);if(m)t=`${m[1]}\\frac{${esc(m[2])}}{${esc(m[3])}}`;if(window.katex){try{p.innerHTML=katex.renderToString(t,{throwOnError:false})}catch(e){p.textContent=v}}else p.textContent=v}
function navPop(n,cur){return `<div class="pop"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px"><b>Section 2, Module ${S.m+1}: Math Questions</b><button style="background:none;border:0;font-size:20px" onclick="popOpen=false;render()">✕</button></div><div class="lg"><span>📍 Current</span><span>⬚ Unanswered</span><span style="color:var(--bad)">■ For Review</span></div><div class="grid">${S.ans[S.m].map((a,k)=>`<button class="g ${a.v?"done":""} ${cur&&k===S.i?"cur":""} ${S.flag[S.m][k]?"f":""}" onclick="go(${k})">${k+1}</button>`).join("")}</div><div style="text-align:center"><button class="btn o" onclick="review()">Go to Review Page</button></div></div>`}
function pick(L){const a=A();if((a.el||[]).includes(L))return;a.v=a.v===L?a.v:L;render()}
function elim(L){const a=A();a.el=a.el||[];const i=a.el.indexOf(L);if(i<0){a.el.push(L);if(a.v===L)a.v=""}else a.el.splice(i,1);render()}
function go(k){Z=1;S.i=k;popOpen=false;render()}
function review(){popOpen=false;const n=S.t.modules[S.m].length,done=S.ans[S.m].filter(a=>a.v).length;
 $("#app").innerHTML=shell(`<div class="page"><div class="panel" style="text-align:center"><h2 style="margin:0 0 4px">Check Your Work</h2><p style="color:var(--mut);margin:0 0 6px">On test day, you won't be able to move on to the next module until time expires. For these practice questions, you can click <b>${S.m===0?"Submit Module 1":"Submit Test"}</b> when you're ready.</p><p style="margin:4px 0 14px"><span class="chip">${done} / ${n} answered</span><span class="chip">${S.flag[S.m].filter(Boolean).length} marked</span></p>
 <div class="grid" style="max-width:600px;margin:auto">${S.ans[S.m].map((a,k)=>`<button class="g ${a.v?"done":""} ${S.flag[S.m][k]?"f":""}" onclick="go(${k})">${k+1}</button>`).join("")}</div></div></div>`,
 `<footer class="nav"><span class="who">${esc(NAME||S.t.title)}</span><span></span><span class="r"><button class="btn" onclick="go(n_last())">Back</button><button class="btn" onclick="confirmEnd()">${S.m===0?"Submit Module 1":"Submit Test"}</button></span></footer>`)}
function n_last(){return S.t.modules[S.m].length-1}
function confirmEnd(){const un=S.ans[S.m].filter(a=>!a.v).length;
 const d=document.createElement("div");d.className="mask";d.innerHTML=`<div><h3>${S.m===0?"Submit Module 1?":"Submit the test?"}</h3><p style="color:var(--mut)">${un?`<b class="bad">${un} question(s) unanswered.</b> `:""}You can't return to this module after submitting.</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn o" onclick="this.closest('.mask').remove()">Cancel</button><button class="btn" onclick="this.closest('.mask').remove();finishModule()">Submit</button></div></div>`;document.body.appendChild(d)}
function finishModule(){if(S.m===0){S.m=1;S.i=0;S.left=S.t.time||2100;popOpen=false;breakScreen()}else{clearInterval(timer);results()}}
function breakScreen(){clearInterval(timer);closeCalc();$("#app").innerHTML=`<div class="home" style="display:grid;place-items:center"><div class="panel" style="text-align:center;max-width:480px"><div class="brand" style="justify-content:center"><i>✓</i></div><h2>Module 1 submitted</h2><p style="color:var(--mut)">Module 2 has 22 questions and ${Math.round((S.t.time||2100)/60)} minutes. The timer starts when you continue.</p><button class="btn" onclick="runTimer();render()">Start Module 2</button></div></div>`}

function num(s){s=String(s).replace(/\s/g,"");if(/^-?\d*\.?\d+\/-?\d*\.?\d+$/.test(s)){const[a,b]=s.split("/");return a/b}const v=Number(s);return s===""?NaN:v}
function ok(q,a){if(!a.v)return false;if(q.type!=="spr")return a.v===q.answer;const u=num(a.v.replace(/,/g,''));return [].concat(q.answer).some(c=>String(c).replace(/\s/g,"")===a.v.replace(/\s/g,"")||(!isNaN(u)&&Math.abs(num(c)-u)<1e-9))}
let RT=0;
function results(){localStorage.removeItem('satS');closeCalc();var o=document.getElementById('refo');if(o)o.remove();document.body.classList.remove('intest');let raw=0;const per=[0,0];
 S.t.modules.forEach((m,mi)=>m.forEach((q,i)=>{if(ok(q,S.ans[mi][i])){raw++;per[mi]++}}));
 const total=S.t.modules.reduce((s,m)=>s+m.length,0),sc=S.t.scale&&S.t.scale[raw];
 const rows=mi=>S.t.modules[mi].map((q,i)=>{const a=S.ans[mi][i],r=ok(q,a);return `<tr class="r" onclick="showQ(${mi},${i})"><td><b>${i+1}</b></td><td>${esc(a.v||"—")}</td><td>${esc([].concat(q.answer)[0])}</td><td><span class="tag ${r?"ok":"bad"}">${r?"Correct":a.v?"Incorrect":"Omitted"}</span></td></tr>`}).join("");
 window._rows=rows;
 $("#app").innerHTML=`<div class="page" style="padding-top:40px"><div class="panel"><div class="score"><div class="ring" style="--p:${Math.round((sc-200)/6)}"><div><span><b>${sc}</b><br><small>Math score</small></span></div></div>
 <div><div class="brand">${esc(S.t.title)}</div><h2 style="margin:6px 0">${raw} / ${total} correct</h2><div>Likely range: <b>${S.t.range[raw]}</b> · Level: <b>${raw>=40?"Exceptional":raw>=33?"Strong":raw>=25?"Proficient":raw>=16?"Developing":"Building"}</b></div>
 <div class="stats"><span>Module 1: <b>${per[0]}/${S.t.modules[0].length}</b></span><span>Module 2: <b>${per[1]}/${S.t.modules[1].length}</b></span></div>
 <p style="color:var(--mut);font-size:13px;margin:10px 0 0">The Digital SAT is adaptive, so this is an estimate — use it to track progress.</p></div></div></div>
 <div class="panel"><div class="tabs"><button id="rt0" class="on" onclick="rtab(0)">Module 1</button><button id="rt1" onclick="rtab(1)">Module 2</button></div><p style="color:var(--mut);font-size:14px;margin:0 0 6px">Tap a row to see the question.</p>
 <table class="rt"><thead><tr><th>#</th><th>Your answer</th><th>Correct</th><th></th></tr></thead><tbody id="rtb">${rows(0)}</tbody></table>
 <p style="margin-top:18px"><button class="btn" onclick="home()">Back to tests</button></p></div></div>`}
function rtab(m){$("#rtb").innerHTML=window._rows(m);$("#rt0").className=m?"":"on";$("#rt1").className=m?"on":""}

function saved(){try{const d=JSON.parse(localStorage.getItem("satS"));const t=TESTS.find(x=>x.id==d.id);return t?{...d,t}:null}catch(e){return null}}
function resume(){const d=saved();if(!d)return home();S={t:d.t,m:d.m,i:d.i,ans:d.ans,flag:d.flag,hide:d.hide,left:d.p?d.left:Math.max(1,d.left-Math.floor((Date.now()-d.at)/1000))};popOpen=false;runTimer();render()}
function modal(html){const d=document.createElement("div");d.className="mask";d.innerHTML=`<div style="max-width:720px;width:94vw;max-height:88vh;overflow:auto">${html}<p style="text-align:right;margin-bottom:0"><button class="btn" onclick="this.closest('.mask').remove()">Close</button></p></div>`;d.addEventListener('click',e=>{if(e.target===d)d.remove()});document.body.appendChild(d);tex(d)}
function showQ(mi,i){const q=S.t.modules[mi][i],a=S.ans[mi][i];modal(`<b>Module ${mi+1} · Question ${i+1}</b><div class="qtext" style="margin-top:10px">${q.img?`<img src="${q.img}" style="max-width:100%"><br>`:""}${q.text}</div>${q.type==="spr"?`<p>Your answer: <b>${esc(a.v||"—")}</b><br>Correct answer: <b>${esc([].concat(q.answer).join(" or "))}</b></p>`:`<div class="chs">`+q.choices.map((c,k)=>{const L="ABCD"[k];return `<div class="ch" style="cursor:default;${L===q.answer?"border-color:var(--ok);box-shadow:0 0 0 2px var(--ok);background:#e9f7ef":L===a.v?"border-color:var(--bad);background:#fdecec":""}"><span class="L">${L}</span><span class="t">${c}</span><b>${L===q.answer?"✓":L===a.v?"✗ yours":""}</b></div>`}).join("")+`</div>`}`)}
home();
</script></body></html>
