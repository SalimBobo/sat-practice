<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Digital SAT Math Practice</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Noto+Serif:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{--rw:min(40vw,520px);--fg:#1b1d24;--mut:#666b78;--line:#dde1ea;--pri:#3054d4;--pri2:#2240b3;--sel:#edf2ff;--bad:#d64545;--ok:#1f9d55;--hdr:#f2f5fb;--hh:76px;--fh:68px;--cw:min(42vw,580px)}
*{box-sizing:border-box}
html,body{margin:0}
body{font:16px/1.55 Inter,system-ui,"Segoe UI",Arial,sans-serif;color:var(--fg);background:#fff;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer;color:inherit}
.btn{background:var(--pri);color:#fff;border:0;border-radius:999px;padding:9px 24px;font-weight:600;transition:background .15s,transform .05s}
.btn:hover{background:var(--pri2)}.btn:active{transform:translateY(1px)}
.btn.o{background:#fff;color:var(--pri);box-shadow:inset 0 0 0 1.5px var(--pri)}.btn.o:hover{background:var(--sel)}
.btn:disabled{opacity:.35;cursor:default}

/* ---------- home ---------- */
.home{min-height:100vh;background:radial-gradient(1200px 500px at 10% -10%,#dfe7ff 0,transparent 60%),radial-gradient(900px 500px at 110% 10%,#e6f4ff 0,transparent 55%),#f7f8fc}
.wrap{max-width:780px;margin:0 auto;padding:48px 22px 60px}
.brand{display:flex;align-items:center;gap:12px;color:var(--pri);font-weight:700;letter-spacing:.02em;font-size:14px;text-transform:uppercase}
.brand i{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#3a63f0,#1b2f8f);display:grid;place-items:center;color:#fff;font-style:normal;font-size:17px}
.home h1{font-size:40px;line-height:1.15;margin:14px 0 8px;letter-spacing:-.02em}
.home .sub{color:var(--mut);margin:0 0 26px;font-size:17px}
.name{display:flex;gap:10px;align-items:center;margin-bottom:22px}
.name input{font:inherit;font-size:17px;padding:11px 16px;border:1.5px solid var(--line);border-radius:12px;width:300px;max-width:100%;background:#fff;outline:none}
.name input:focus{border-color:var(--pri);box-shadow:0 0 0 4px #3054d420}
.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px 20px;margin:12px 0;display:flex;justify-content:space-between;align-items:center;gap:14px;box-shadow:0 1px 2px #0000000a,0 6px 20px -12px #1b2f8f33;transition:transform .15s,box-shadow .15s}
.card:hover{transform:translateY(-2px);box-shadow:0 1px 2px #0000000a,0 14px 30px -14px #1b2f8f55}
.card .ic{width:48px;height:48px;border-radius:12px;background:var(--sel);color:var(--pri);display:grid;place-items:center;font-weight:800;font-size:18px;flex:none}
.card .meta{flex:1}.card .meta b{font-size:17px}.card small{color:var(--mut)}
.card.res{background:linear-gradient(90deg,#edf2ff,#fff)}
.chip{display:inline-block;background:#eef1f7;border-radius:999px;padding:1px 9px;font-size:12px;color:var(--mut);margin-right:6px;font-weight:600}

/* ---------- test shell ---------- */
header.top{position:fixed;top:0;left:0;right:0;height:var(--hh);z-index:60;background:var(--hdr);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px}
header.top::after,footer.nav::before{content:"";position:absolute;left:0;right:0;height:3px;background:repeating-linear-gradient(90deg,#1b1d24 0 14px,transparent 14px 20px)}
header.top::after{bottom:0}footer.nav::before{top:0}
.sec b{font-size:19px;display:block;line-height:1.2}.sec .tool{padding:2px 0;font-size:14px;color:var(--fg);font-weight:500}
.timer{text-align:center}.timer #tm{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.02em;display:block;min-height:30px}
.timer.low #tm{color:var(--bad)}
.timer .hide{border:1.5px solid var(--fg);border-radius:999px;background:#fff;padding:0 14px;font-weight:600;font-size:13px}
.tools{display:flex;gap:4px;justify-content:flex-end}
.tool{background:none;border:0;padding:4px 10px;border-radius:10px}
.tools .tool{display:flex;flex-direction:column;align-items:center;gap:1px;font-size:13px;font-weight:500;min-width:74px}
.tools .tool svg{width:24px;height:24px}
.tools .tool:hover{background:#e2e8f5}.tools .tool.on{background:#dfe6fa;color:var(--pri2)}
main.q{padding:calc(var(--hh) + 26px) 28px calc(var(--fh) + 40px);transition:margin-left .25s ease}
.qin{max-width:800px;margin:0 auto}
.qhead{display:flex;align-items:center;gap:14px;background:#f0f2f7;height:44px;padding-right:10px;position:relative;margin-bottom:22px}
.qhead::after{content:"";position:absolute;left:0;right:0;bottom:-3px;height:3px;background:repeating-linear-gradient(90deg,#1b1d24 0 10px,transparent 10px 15px)}
.num{background:var(--fg);color:#fff;height:100%;min-width:44px;display:grid;place-items:center;font-weight:700;font-size:17px}
.flag{background:none;border:0;display:flex;align-items:center;gap:7px;font-size:15px;font-weight:500;padding:4px 6px;border-radius:6px}.flag:hover{background:#e3e7f0}
.abc{margin-left:auto;border:0;border-radius:6px;padding:2px 8px;font-weight:700;font-size:14px;text-decoration:line-through;background:#fff;color:var(--fg);box-shadow:inset 0 0 0 1.5px var(--fg)}
.abc.on{background:var(--pri);color:#fff;box-shadow:none}
.qtext{font-family:"Noto Serif",Georgia,"Times New Roman",serif;font-size:19px;line-height:1.65;margin-bottom:22px}
.qtext .katex-display{margin:.55em 0}
.qtext .rn{margin:10px 0 4px 6px}
table.dt{border-collapse:collapse;margin:4px auto 16px;font-size:18px}
table.dt th,table.dt td{border:1.5px solid #3b82c4;padding:7px 18px;text-align:center}
table.dt th{background:#eaf4fc;font-weight:600}
.qtext table:not(.dt){border-collapse:collapse;margin:8px 0}.qtext table:not(.dt) td,.qtext table:not(.dt) th{border:1px solid var(--line);padding:5px 12px}
.chs{display:flex;flex-direction:column;gap:12px}
.chrow{display:flex;align-items:center;gap:10px}
.ch{flex:1;display:flex;align-items:center;gap:14px;border:1.5px solid #8b8f9a;border-radius:10px;padding:11px 16px;cursor:pointer;background:#fff;transition:border-color .12s,background .12s,box-shadow .12s;position:relative}
.ch:hover{border-color:var(--pri);box-shadow:0 0 0 1px var(--pri)}
.ch.sel{border-color:var(--pri);box-shadow:0 0 0 2px var(--pri);background:var(--sel)}
.ch .t{flex:1;font-family:"Noto Serif",Georgia,serif;font-size:18px}
.L{width:30px;height:30px;border-radius:50%;border:1.8px solid var(--fg);display:grid;place-items:center;font-weight:700;flex:none;font-size:15px}
.ch.sel .L{background:var(--pri);color:#fff;border-color:var(--pri)}
.ch.el{opacity:.55}.ch.el::after{content:"";position:absolute;left:8px;right:8px;top:50%;height:2px;background:var(--fg)}
.x{background:none;border:1.5px solid var(--fg);border-radius:50%;width:26px;height:26px;display:grid;place-items:center;font-size:12px;font-weight:700;flex:none}
.x.u{width:auto;border:0;text-decoration:underline;font-weight:600;font-size:14px}
.sprbox{display:flex;gap:28px;flex-wrap:wrap;align-items:flex-start}
input.spr{font:600 22px Inter,sans-serif;padding:10px 16px;border:0;border-bottom:2.5px solid var(--fg);border-radius:8px 8px 0 0;width:210px;background:#f4f6fa;outline:none}
input.spr:focus{border-color:var(--pri);background:var(--sel)}
.prev{color:var(--mut);font-size:14px}.prev div{font-size:22px;color:var(--fg);min-height:34px}
.hint{color:var(--mut);font-size:14px;margin-top:14px}
footer.nav{position:fixed;left:0;right:0;bottom:0;height:var(--fh);z-index:60;background:var(--hdr);display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 22px}
footer.nav .who{font-size:18px;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
footer.nav .r{justify-self:end;display:flex;gap:10px}
.pill{background:var(--fg);color:#fff;border:0;border-radius:8px;padding:8px 16px;font-weight:600;display:flex;align-items:center;gap:8px}
.pop{position:fixed;left:50%;bottom:calc(var(--fh) + 12px);transform:translateX(-50%);width:min(580px,94vw);background:#fff;border-radius:16px;box-shadow:0 20px 60px -10px #0005,0 0 0 1px #0001;padding:20px 22px;z-index:70;animation:up .18s ease}
.pop::after{content:"";position:absolute;left:50%;bottom:-8px;width:16px;height:16px;background:#fff;transform:translateX(-50%) rotate(45deg)}
@keyframes up{from{opacity:0;transform:translate(-50%,8px)}}
.pop .lg{display:flex;gap:16px;justify-content:center;font-size:13px;color:var(--mut);padding-bottom:10px;border-bottom:1px solid var(--line)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(44px,1fr));gap:12px;margin:14px 0}
.g{height:44px;border:1.5px dashed #8b8f9a;background:#fff;color:var(--pri);border-radius:6px;position:relative;font-weight:700}
.g.done{border:0;background:var(--pri);color:#fff}.g.cur::before{content:"📍";position:absolute;top:-14px;left:50%;transform:translateX(-50%);font-size:13px}
.g.f::after{content:"";position:absolute;top:-6px;right:-6px;width:14px;height:16px;background:var(--bad);clip-path:polygon(0 0,100% 0,100% 100%,50% 72%,0 100%)}
.ok{color:var(--ok)}.bad{color:var(--bad)}

/* figure */
.fig{max-width:620px;margin:0 auto 18px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:#fff}
.zb{display:flex;gap:6px;justify-content:center;align-items:center;background:#f6f7fa;padding:5px;border-bottom:1px solid var(--line)}
.zb button{background:none;border:0;font-size:15px;padding:3px 10px;border-radius:6px}.zb button:hover{background:#e6e9f1}
.zb span{font:600 13px Inter;color:var(--mut);min-width:44px;text-align:center}
.zv{overflow:auto;max-height:460px;text-align:center;padding:10px}
.zv img{height:auto}

/* ---------- calculator (Bluebook style: docked left, question slides right) ---------- */
#desmos{position:fixed;left:var(--cx,0px);top:var(--cy,var(--hh));height:var(--ch,calc(100vh - var(--hh) - var(--fh)));width:var(--cw);background:#fff;z-index:50;display:none;flex-direction:column;box-shadow:6px 0 24px -12px #0004;animation:slide .22s ease}
@keyframes slide{from{transform:translateX(-30px);opacity:0}}
body.cc #desmos{display:flex}
body.cc main.q{margin-left:var(--cw)}
body.cc.cfl main.q{margin-left:0}
body.cfl #desmos{border-radius:12px;box-shadow:0 24px 60px -12px #0007,0 0 0 1px #0002;animation:none}
body.cfl #dh{border-radius:12px 12px 0 0}
body.cfl #dc,body.cfl #dsci{border-radius:0 0 12px 12px;overflow:hidden}
#dh{cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none}
#dh .ttl{pointer-events:none}.rb{user-select:none;-webkit-user-select:none}#dh button{cursor:pointer}
body.dragm,body.dragm *{cursor:grabbing!important}
body.cfl #drs::before{background:transparent}body.cfl #drs i{opacity:.75}body.cfl #dcr{border-bottom-right-radius:12px}
#dh .grabdots{display:flex;flex-direction:column;gap:3px;opacity:.55;margin-right:2px}
#dh .grabdots i{display:block;width:14px;height:2px;background:#fff;border-radius:2px}
body.rr main.q{margin-right:var(--rw)}
main.q{transition:margin .25s ease}
body.drag main.q{transition:none}
#dh{background:#1b1d24;color:#fff;display:flex;align-items:center;gap:10px;padding:8px 10px 8px 14px;flex:none}
#dh .ttl{font-weight:700;margin-right:4px}
.ct{display:flex;background:#33363f;border-radius:9px;padding:3px}
.ct button{border:0;border-radius:7px;padding:4px 12px;font-weight:600;font-size:14px;background:none;color:#cfd2da}
.ct .on{background:#fff;color:#111}
#dh .sp{flex:1}
#dh .ib{background:none;border:0;color:#fff;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:18px}
#dh .ib:hover{background:#ffffff22}
#dh .cx{font-size:22px}
#dc,#dsci{flex:1;min-height:0}
body.drag,body.drag *{cursor:ew-resize!important;user-select:none}
body.dragc,body.dragc *{cursor:nwse-resize!important}body.dragc2,body.dragc2 *{cursor:nesw-resize!important}
body.drag iframe,body.drag #dc,body.drag #dsci{pointer-events:none}
.grip{position:absolute;bottom:0;width:22px;height:22px;z-index:3;touch-action:none}
.grip svg{width:100%;height:100%}
#dcr{right:0;cursor:nwse-resize;background:linear-gradient(135deg,transparent 50%,#1b1d24 50%)}
#rcr{left:0;cursor:nesw-resize;background:linear-gradient(225deg,transparent 50%,#1b1d24 50%)}
.grip::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(var(--a,135deg),transparent 0 4px,#ffffff88 4px 5px);clip-path:polygon(100% 0,100% 100%,0 100%)}
#rcr::after{--a:225deg;clip-path:polygon(0 0,100% 100%,0 100%)}
.edge{position:absolute;top:0;bottom:0;width:14px;cursor:ew-resize;z-index:2;display:grid;place-items:center;touch-action:none}
.edge::before{content:"";width:4px;height:100%;background:#1b1d24}
.edge i{position:absolute;width:14px;height:46px;background:#1b1d24;border-radius:7px;display:grid;place-items:center}
.edge i::after{content:"";height:22px;border-left:1.5px solid #fff;border-right:1.5px solid #fff;width:4px}
.edge:hover::before,.edge:hover i{background:var(--pri)}
.load{display:grid;place-items:center;height:100%;color:var(--mut);position:absolute;inset:0;pointer-events:none}
#dc,#dsci{position:relative}

/* reference */
#drs{right:-7px}#rrs{left:-7px}
#rcr{left:-14px;bottom:8px;width:36px;height:36px;border-radius:50%;background:#fff;color:#111;box-shadow:0 2px 8px #0004,0 0 0 1px #0003;display:grid;place-items:center;z-index:5}
#rcr::after{display:none}#rcr svg{width:20px;height:20px}#rcr:hover{background:#eef2ff;color:var(--pri)}
.rb .rdots{margin-right:8px}.rb:hover .rdots{background:#ffffff18}.rb{cursor:grab}
/* ---- Bluebook-style calculator chrome ---- */
#dh{padding:10px 14px 10px 18px;gap:12px;min-height:64px}
#dh .ct{background:#fff;border-radius:12px;padding:0;border:2px solid #fff;overflow:hidden}
#dh .ct button{display:flex;align-items:center;gap:6px;padding:7px 10px;border-radius:0;background:#1b1d24;color:#fff;font-weight:700;font-size:17px}
#dh .ct button svg{width:24px;height:24px;flex:none}
#dh .ct button.on{background:#fff;color:#111}#dh .ct button.on span{text-decoration:underline;text-underline-offset:3px}
#dh .sp{display:flex;justify-content:center}
.mvdots{display:grid;grid-template-columns:repeat(3,5px);gap:6px 7px;padding:8px 10px;border-radius:8px}
.mvdots i{width:5px;height:5px;border-radius:50%;background:#fff}
#dh:hover .mvdots{background:#ffffff18}
#dh .cx{width:40px;height:40px}
#desmos #drs::before,#desmos #drs i{display:none}#desmos #drs{width:12px;right:-6px}
#desmos{box-shadow:0 0 0 1px #1b1d24,6px 0 24px -12px #0004}
#dcr{right:-18px;bottom:8px;width:36px;height:36px;border-radius:50%;background:#fff;color:#111;box-shadow:0 2px 8px #0004,0 0 0 1px #0003;display:grid;place-items:center;z-index:5}
#dcr::after{display:none}#dcr svg{width:20px;height:20px;transform:rotate(0deg)}
#dcr:hover{background:#eef2ff;color:var(--pri)}
body.cfl #dcr{border-bottom-right-radius:50%;bottom:-14px;right:-14px}
#desmos{container-type:size}
#dh .ct{flex:none;min-width:0}
@container (max-width:440px){#dh .ct button span{display:none}#dh .ct button{padding:7px 12px}}
#refo{position:fixed;right:0;top:var(--hh);height:var(--rh,calc(100vh - var(--hh) - var(--fh)));width:var(--rw);background:#fff;z-index:55;display:flex;flex-direction:column;box-shadow:-8px 0 30px -12px #0005;animation:sr .2s ease}
@keyframes sr{from{transform:translateX(30px);opacity:0}}
.rb{background:#1b1d24;color:#fff;display:flex;align-items:center;gap:6px;padding:8px 10px 8px 16px;font-size:17px;flex:none}
.rb b{flex:1}
.rb button{background:none;border:0;color:#fff;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;font-size:18px}
.rb button:hover{background:#ffffff22}.rb .cx{font-size:22px}
.rbody{padding:18px 20px 30px;overflow:auto;flex:1;text-align:center}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 14px;align-items:end;justify-items:center}
.rt{width:100%;text-align:center}.rt.w2{grid-column:1/-1}.rt img{width:100%;height:auto}
.rfacts{list-style:none;padding:0;margin:26px 4px 0;text-align:left;font-family:"Noto Serif",Georgia,serif;font-size:17px}
.rfacts li{margin:0 0 14px}

/* modal */
.mask{position:fixed;inset:0;background:#10142a66;backdrop-filter:blur(2px);display:grid;place-items:center;z-index:90;animation:fd .15s}
@keyframes fd{from{opacity:0}}
.mask>div{background:#fff;padding:26px 28px;border-radius:18px;max-width:440px;box-shadow:0 30px 80px -20px #0007}
.mask h3{margin:0 0 6px}

/* review & results */
.page{min-height:100vh;background:#f7f8fc;padding:calc(var(--hh) + 30px) 20px 60px}
.panel{background:#fff;border-radius:18px;border:1px solid var(--line);padding:26px;max-width:760px;margin:0 auto 18px;box-shadow:0 10px 30px -18px #1b2f8f40}
.score{display:grid;grid-template-columns:auto 1fr;gap:26px;align-items:center}
.ring{width:150px;height:150px;border-radius:50%;display:grid;place-items:center;background:conic-gradient(var(--pri) calc(var(--p)*1%),#e7ebf5 0)}
.ring div{width:120px;height:120px;border-radius:50%;background:#fff;display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font-size:38px;color:var(--pri)}.ring small{color:var(--mut);font-size:12px}
.stats{display:flex;gap:10px;flex-wrap:wrap;margin-top:10px}.stats span{background:#f2f4f9;border-radius:10px;padding:6px 12px;font-size:14px}
table.rt{border-collapse:collapse;width:100%;font-size:15px}
table.rt td,table.rt th{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left}
table.rt tr.r:hover{background:#f6f8fd;cursor:pointer}
.tag{display:inline-block;border-radius:999px;padding:1px 10px;font-weight:700;font-size:13px}.tag.ok{background:#e6f6ec}.tag.bad{background:#fdeaea}
.tabs{display:flex;gap:8px;margin-bottom:12px}.tabs button{border:0;background:#eef1f7;border-radius:999px;padding:6px 16px;font-weight:600}.tabs .on{background:var(--fg);color:#fff}

@media(max-width:900px){:root{--cw:min(48vw,460px)}.tools .tool{min-width:54px;font-size:12px}}
@media(max-width:680px){
 :root{--hh:64px;--fh:62px}
 header.top{padding:0 10px}.sec b{font-size:15px}.timer #tm{font-size:19px}.tools .tool{min-width:44px;font-size:0;padding:4px 6px}
 footer.nav{padding:0 10px}footer.nav .who{display:none}footer.nav{grid-template-columns:auto 1fr}footer.nav .pill{justify-self:start}
 main.q{padding-left:16px;padding-right:16px}
 #desmos,#refo{top:var(--py,var(--hh))!important;bottom:auto!important;border-radius:14px!important;overflow:visible!important;box-shadow:0 18px 50px -10px #0007,0 0 0 1px #0003!important}
 #desmos{left:var(--mcx,0px)!important;top:var(--mcy,var(--hh))!important;width:var(--mcw,100vw)!important;height:var(--mch,56vh)!important}
 #refo{left:var(--mrx,0px)!important;right:auto!important;top:var(--mry,var(--hh))!important;width:var(--mrw,100vw)!important;height:var(--mrh,56vh)!important}
 #dh{border-radius:14px 14px 0 0!important}.rb{border-radius:14px 14px 0 0}
 #dc,#dsci{border-radius:0 0 14px 14px;overflow:hidden}.rbody{border-radius:0 0 14px 14px}
 body.cc main.q,body.rr main.q{margin-left:0;margin-right:0}
 #dh,.rb{cursor:move;touch-action:none}
 #dh .ct button{padding:6px 9px}#dh .ct button span{display:none}
 #drs,#rrs{display:none!important}
 #dcr,#rcr{display:grid!important;bottom:6px!important;width:42px!important;height:42px!important;border-radius:50%!important;touch-action:none}
 #dcr{right:6px!important}#rcr{left:6px!important}
 .rb .ex{display:none}
 .home h1{font-size:30px}.score{grid-template-columns:1fr;justify-items:center}
}

imeters (mm). Circle $N$ has an area of $144\\pi$ mm$^2$. The radius of circle $P$ is equal to the difference of the radius of circle $N$ and the radius of circle $M$. What is the total area, in mm$^2$, of circles $M$, $N$, and $P$?", "type": "mc", "choices": ["$193\\pi$", "$218\\pi$", "$288\\pi$", "$344\\pi$"], "answer": "B"}, {"text": "$$-\\frac1{12}rx+\\frac56=9-\\frac34x$$ In the given equation, $r$ is a constant. The equation has no solution. What is the value of $r$?", "type": "spr", "answer": ["9"]}, {"text": "$$-6x(x+8)=18$$ One solution to the given equation can be written as $z-\\frac a2\\sqrt b$, where $z$, $a$, and $b$ are integers and $a$ and $b$ are positive. What is the value of $\\frac ab$?", "type": "mc", "choices": ["$\\frac1{26}$", "$\\frac2{13}$", "$\\frac4{13}$", "$\\frac{13}2$"], "answer": "B"}, {"text": "$$17(x-c)=17y+17c$$ One of the equations in a system of two linear equations is given, where $c$ is a positive constant. The system has no solution. Which equation could be the second equation in this system?", "type": "mc", "choices": ["$3x-3y=6c$", "$3x+3y=6c$", "$3x-3y=3c$", "$3x+3y=3c$"], "answer": "C"}, {"text": "$$(x-m)^2=(m-6a)(x-m)$$ In the given equation, $a$ and $m$ are constants, where $m>6a$. The sum of the solutions to the equation is $3m+48$. What is the value of $a$?", "type": "spr", "answer": ["-8"]}, {"text": "The function $p$ is defined by $p(x)=a\\big((x+7)^2-b\\big)\\big((x+7)^2+c\\big)$, where $a$, $b$, and $c$ are constants. In the $xy$-plane, the graph of $y=p(x)$ passes through the points $(-9,44)$ and $(0,517)$. What is the value of $p(-5)+p(-14)$?", "type": "spr", "answer": ["561"]}, {"text": "A quadratic function models the height, in feet, of a projectile above the ground in terms of the time, in seconds, after the projectile was launched. According to the model, the projectile was launched from a height of 0 feet and reached its maximum height of 2,025 feet, 9 seconds after it was launched. Based on the model, what was the height, in feet, of the projectile 5 seconds after it was launched?", "type": "spr", "answer": ["1625"]}, {"text": "The equation $N(m)=80(Q)^{m/4}$ gives the predicted population $N(m)$, in thousands, of a bacteria colony $m$ minutes after the initial measurement, where $Q$ is a constant greater than 1. The predicted population increases by $p\\%$ every 240 seconds. What is the value of $p$ in terms of $Q$?", "type": "mc", "choices": ["$100(Q-1)$", "$100(Q+1)$", "$100(Q^4-1)$", "$100(Q^{1/4}-1)$"], "answer": "A"}]]}, {"id": 11, "title": "SAT Practice Test 11", "time": 2100, "modules": [[{"text": "The function $v$ models the volume, in liters, of water remaining in a tank $x$ minutes after the tank began draining. The graph of $y=v(x)$ is shown. According to the model, what was the volume, in liters, of water remaining in the tank 6 minutes after the tank began draining?", "type": "mc", "choices": ["5", "15", "30", "45"], "answer": "B", "img": "data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAiMAAAGBCAIAAAA7dCaeAABGi0lEQVR42u3deVzU1f4/8DPDrAzLMAwMmywii2yCqGiQiopUaJEmWrbhkl8ls19mlMute7tey26U18xMEyu3JLPQVLwmlYQgIosii6yyb4IwMBvM/P74GI7DctGAGWZez4d/yJkPM3MOn5nXnM/nzPtDU6lUBAAAYNjQMQQAAICkAQAAJA0AAACSBgAAtIKhNz2pr69///33e7eHhoYuXLhQozExMXH//v3l5eVWVlYLFix45ZVXjIyMsDcAACBpBtLS0rJr164+eshgaCRNbGzsxx9/vG3btn/961+5ubkxMTE//fTTqVOnGAwGdggAACTNQJycnIqLizUa6fT7jhCeOXNm+/btGzdu3LBhAyHEy8uLzWYvWLBg27ZtW7ZswQ4BADDkaHrzfZqCgoLHHnusvLx84M1CQkL++OOPyspKBwcHqkWlUjk4OHR2dtbX17NYLOwTAABDy7BWBDQ2Nqampjo7O/fEDCGERqOFhIS0trYmJydjhwAAGHL6dmaitrY2KSmptrbW1NQ0KCho8uTJ6rfm5OSoVCpXV1eN36JasrOzw8PDsU8AAGBO06+ampqAgIBLly4pFIpLly4FBwc/+uijVVVVPRtUVlYSQoRCocYvWllZEULUtwQAAMxpNBkbG4eHh3/55Ze2trZUy7Jly+bMmfPYY49dvXqVOgHT0dFBCGGz2Rq/S7WIxeLBPFDvKREAgOEoKSkx3DmNo6PjyZMne2KGEDJ79uyIiIi8vLyjR49SLUwmkxDS1dWl8btUC5YDAAAMBz1fETB16lRCyMWLF6kfLS0t+5y7UC0CgQA7BADAkNPz7ypSp2Tu3LlD/ejp6Un6Oh9Dnb+hbh3WKeSQOJBSSgh5OWSstkZVu08A3Uf30X2tPPpfOXGgP3Oazz77LDs7W6ORCpWeQ2peXl4ikejGjRsKhUJ9s6ysLEJIaGgoPnoAAAw5/UmaAwc rgin:8px 0'><tr><th>Value<\/th><th>Set A<\/th><th>Set B<\/th><th>Set C<\/th><th>Set D<\/th><\/tr><tr><td>5<\/td><td>9<\/td><td>8<\/td><td>0<\/td><td>0<\/td><\/tr><tr><td>15<\/td><td>6<\/td><td>5<\/td><td>3<\/td><td>2<\/td><\/tr><tr><td>25<\/td><td>4<\/td><td>5<\/td><td>5<\/td><td>4<\/td><\/tr><tr><td>35<\/td><td>2<\/td><td>3<\/td><td>5<\/td><td>6<\/td><\/tr><tr><td>45<\/td><td>0<\/td><td>0<\/td><td>8<\/td><td>9<\/td><\/tr><\/table>", "type": "mc", "choices": ["Data set A", "Data set B", "Data set C", "Data set D"], "answer": "D"}, {"text": "Which expression is a factor of $x^4+18bx^2+81b^2-25$, where $b$ is a positive constant?", "type": "mc", "choices": ["$x^2+9b-5$", "$x^2-9b+5$", "$x^2+18b$", "$x^2-5b$"], "answer": "A"}, {"text": "On January 1, 1995, a company had 4,318 employees, and on January 1, 2015, the company had 5,058 employees. The equation $20x+4{,}318=5{,}058$ describes this situation. Which is the best interpretation of $x$ in this context?", "type": "mc", "choices": ["The total increase in the number of employees between 1995 and 2015", "The number of employees the company is projected to have in 2035", "The average increase per year in the number of employees between 1995 and 2015", "The percentage by which the number of employees increased each year between 1995 and 2015"], "answer": "C"}, {"text": "The function $f$ is defined by $f(x)=x^3+5x^2-9x-63$. In the $xy$-plane, the graph of $y=h(x)$ is the result of translating the graph of $y=f(x)$ right 2 units and up 11 units. What is the $y$-coordinate of the $y$-intercept of the graph of $y=h(x)$?", "type": "spr", "answer": ["-22"]}, {"text": "In the $xy$-plane, an equation of circle $A$ is $x^2+y^2+10x-6y-2=0$. Circle $B$ has the same center as circle $A$ and a radius that is 3 times the radius of circle $A$. Which equation represents circle $B$?", "type": "mc", "choices": ["$(x+5)^2+(y-3)^2=108$", "$(x+5)^2+(y-3)^2=324$", "$(x-5)^2+(y+3)^2=324$", "$(x+5)^2+(y-3)^2=18$"], "answer": "B"}, {"text": "A \right)(180)(3)$", "$\\left(\\frac7{15\\pi}\\right)(90)(3)$", "$\\left(\\frac{7\\pi}{15}\\right)(180)(3)$"], "answer": "B"}, {"text": "In $\\triangle JKL$, $JK=KL$ and the measure of angle $K$ is $38^\\circ$. What is the measure of angle $J$?", "type": "mc", "choices": ["$19^\\circ$", "$38^\\circ$", "$71^\\circ$", "$142^\\circ$"], "answer": "C"}, {"text": "What is the $x$-intercept of the graph of $y=\\frac{28-x}{cx+d}$ in the $xy$-plane, where $c$ and $d$ are positive constants?", "type": "mc", "choices": ["$\\left(-\\frac dc,0\\right)$", "$\\left(0,\\frac{28}{d}\\right)$", "$(0,-28)$", "$(28,0)$"], "answer": "D"}, {"text": "$$2x+5y=43$$ $$6x-ky=-25$$ In the given system of equations, $k$ is a constant. The solution to the system is $(x,y)$, where $x=4$. What is the value of $k$?", "type": "spr", "answer": ["7"]}, {"text": "$$D=\\frac{0.75(h-8)}{2w}$$ The given equation relates the density $D$ of a beam to its height $h$, in centimeters, and its width $w$, in centimeters. Which equation correctly expresses the height of the beam in terms of its density and its width?", "type": "mc", "choices": ["$h=\\frac{2wD}{0.75}-8$", "$h=\\frac{2wD}{0.75}+8$", "$h=\\frac{0.75wD}{2}+8$", "$h=\\frac{2wD+8}{0.75}$"], "answer": "B"}, {"text": "For the polynomial function $g$, the graph of $y=g(x)$ in the $xy$-plane passes through the points $(-8,0)$, $(2,0)$, and $(11,0)$. Which of the following must be a factor of $g(x)$?", "type": "mc", "choices": ["$x+2$", "$x-8$", "$x-11$", "$x+11$"], "answer": "C"}, {"text": "$$f(x)=3^{-4(x+2)}$$ Which of the following equivalent forms of the given function $f$ displays, as the base or the coefficient, the $y$-coordinate of the $y$-intercept of the graph of $y=f(x)$ in the $xy$-plane?", "type": "mc", "choices": ["$f(x)=\\frac1{6{,}561}\\left(\\frac13\\right)^{4x}$", "$f(x)=\\left(\\frac13\\right)^{4x+8}$", "$f(x)=3^{-4x-8}$", "$f(x)=6{,}561^{-x-2}$"], "answer": "A"}, {"text": "In the $xy$-plane, line $k$ is perpendicular to the line defined by $4x+7y=21$, has an $x$-intercept of $(-8,0)$, and has a $y$-intercept of $(0,p)$. What is the value of $p$?", "type": "spr", "answer": ["14"]}, {"text": "The vertex of a parabola is at $(34,-19)$. If one of the $x$-intercepts is at $x=51$, what is the $x$-coordinate of the second $x$-intercept of the parabola?", "type": "mc", "choices": ["$-17$", "17", "23", "68"], "answer": "B"}, {"text": "The area of a solar panel array is increasing at a rate of 0.45 square meters per second. Which of the following is closest to this rate expressed in square feet per hour? (1 meter = 3.28 feet)", "type": "mc", "choices": ["1,476", "5,313", "17,429", "57,166"], "answer": "C"}, {"text": "The length of a copper wire, in millimeters, is given by $L(T)=0.0045(T-15)+320$, where $T$ is the temperature in degrees Celsius. If the temperature increases by 400 degrees Celsius, by how much does the length of the wire increase, in millimeters?", "type": "mc", "choices": ["1.8", "4.5", "18", "321.8"], "answer": "A"}, {"text": "A quality engineer selected 2 random samples of a certain model of battery to estimate the average number of hours the battery lasts under continuous use. Based on the first sample, the engineer estimated an average of 18.6 hours, with an associated margin of error of 0.8 hour. Based on the second sample, the engineer estimated an average of 18.9 hours, with an associated margin of error of 1.9 hours. Assuming the margins of error were calculated the same way, which best explains why the first sample obtained a smaller margin of error than the second sample?", "type": "mc", "choices": ["The first sample contained fewer batteries than the second sample.", "The first sample contained more batteries than the second sample.", "The batteries in the first sample lasted fewer hours on average than those in the second sample.", "The batteries in the first sample lasted more hours on average than those in the second sample."], "answer": "B"}, {"text": "Which expression is equivalent to $3x^3+15x^2y+2xy^2+10y^3$?", "type": "mc", "choices": ["$(3x^2+10y)(x+y^2)$", "$(3x^2+2y^2)(x+5y)$", "$(3x^3+2y^2)(x^2+5y^3)$", "$(3x^3+2y^3)(x+5y)$"], "answer": "B"}, {"text": "The function $f$ is defined by $f(x)=ab^{x/n}$, where $a$, $b$, and $n$ are constants, and $b$ and $n$ are integers. If $f(4)=5$ and $f(10)=320$, what is the value of $f(13)$?", "type": "mc", "choices": ["640", "1,280", "2,560", "20,480"], "answer": "C"}, {"text": "Data set $M$ consists of 60 integers, where the value of each integer is between 120 and 180. Data set $N$ consists of the same 60 integers in $M$ as well as the integer 940. Which of the following must be greater for data set $N$ than for data set $M$?<br>I. The mean<br>II. The median", "type": "mc", "choices": ["I only", "II only", "I and II", "Neither I nor II"], "answer": "A"}, {"text": "The function $f$ is defined by $f(x)=a^x-b$, where $a$ and $b$ are constants. In the $xy$-plane, the graph of $y=f(x)$ passes through the points $(c,5)$ and $(2c,137)$, where $c$ is a constant. Which of the following could be the value of $b$?", "type": "mc", "choices": ["7", "12", "132", "144"], "answer": "A"}, {"text": "The scatterplot shows data set $A$, which consists of the masses $y$, in grams, of a rabbit kit at various ages $x$, in weeks. The equation of a line of best fit for the relationship in data set $A$ can be written as $y=3.2+10.7x$, where $1\\le x\\le 5$.<br>The rabbit kit was weighed again at 8 weeks old and had a mass of 120 grams. Data set $B$ consists of all the data points in data set $A$ as well as the data point $(8,120)$. The equation of a line of best fit for data set $B$ can be written as $y=r+sx$, where $r$ and $s$ are constants and $1\\le x\\le 8$. Assuming the equations of the lines of best fit are calculated in the same way, which of the following is the best estimate for the value of $s$?", "type": "mc", "choices": ["6.4", "10.7", "14.9", "21.3"], "answer": "C", "img": "data:image/png;base64,iVBORw0KGgoA T}$ each have a length of 10 centimeters, and angles $Q$ and $T$ each have a measure of $52^\\circ$. Which of the following additional pieces of information is/are sufficient to prove whether triangle $PQR$ is congruent to triangle $STU$?<br>I. The measures of angles $P$ and $R$ are equal.<br>II. The lengths of sides $\\overline{PR}$ and $\\overline{SU}$ are equal.<br>III. The lengths of sides $\\overline{QR}$ and $\\overline{TU}$ are equal.", "type": "mc", "choices": ["I is sufficient, but II and III are not.", "II is sufficient, but I and III are not.", "III is sufficient, but I and II are not.", "II is sufficient and III is sufficient, but I is not."], "answer": "C"}, {"text": "$$\\frac79(x+4)\\left(x+\\sqrt{3k+4}\\right)\\left(x-\\sqrt{3k+4}\\right)=0$$ In the given equation, $k$ is a positive constant. The product of the solutions to the equation is 100. What is the value of $k$?", "type": "spr", "answer": ["7"]}, {"text": "A textile inspector is analyzing the tensile strength of 150 fabric samples by measuring the breaking force, in newtons, of each sample. The mean breaking force of all 150 samples is 640 newtons. The inspector classifies each sample as either <i>reinforced<\/i> or <i>standard<\/i>. Of the 150 samples, 60 were classified as reinforced, and these 60 samples have a mean breaking force of 880 newtons. The remaining 90 samples were classified as standard. What is the mean breaking force, in newtons, of the 90 standard samples?", "type": "spr", "answer": ["480"]}, {"text": "$$y=5\\left(\\frac m9\\right)^{x-d}+n$$ How many times does the graph of the given equation in the $xy$-plane cross the $x$-axis, where $m$, $n$, and $d$ are positive constants such that $m\\lt 9$ and $n>d$?", "type": "mc", "choices": ["Zero", "One", "Two", "Three"], "answer": "A"}, {"text": "The expression $15x^4+34x^2+15$ can be rewritten as $(5x^2+a)(3x^2+b)$, where $a$ and $b$ are positive integers, or as $(5x^2+c)(3x^2+d)$, where $c$ and $d$ are positive non-integers. What is the value of $a+c$?", "type": "spr", "answer": ["34/3", "11.33", "11.333", "11.334"]}]]}, {"id": 12, "title": "SAT Practice Test 12", "time": 2100, "modules": [[{"text": "Which expression is equivalent to $(5a^3b^{-2})(4a^{-1}b^5)$, where $a$ and $b$ are positive?", "type": "mc", "choices": ["$9a^2b^3$", "$20a^2b^3$", "$20a^4b^{-7}$", "$20a^{-3}b^{-10}$"], "answer": "B"}, {"text": "If $9p=-6q$, where $q\\ne 0$, what is the value of $\\dfrac{p}{2q}$?", "type": "spr", "answer": ["-1/3", "-.3333", "-0.3333", "-.333", "-0.333"]}, {"text": "Triangles $ABC$ and $DEF$ are similar, where $A$ corresponds to $D$ and $B$ corresponds to $E$. The measures of angles $A$ and $B$ are $34^\\circ$ and $108^\\circ$, respectively. What is the measure of angle $F$?", "type": "mc", "choices": ["$34^\\circ$", "$38^\\circ$", "$72^\\circ$", "$108^\\circ$"], "answer": "B"}, {"text": "$$y=-3x^2+24x-5$$ The given equation relates the variables $x$ and $y$. What is the maximum value of $y$?", "type": "spr", "answer": ["43"]}, {"text": "The box plots summarize the heights, in centimeters, of the plants in group $P$ and the plants in group $Q$. Based on the box plots, which statement must be true?", "type": "mc", "choices": ["The median height of group $P$ is greater than the median height of group $Q$.", "The median height of group $P$ is less than the median height of group $Q$.", "The range of the heights in group $P$ is less than the range of the heights in group $Q$.", "The interquartile range of the heights in group $P$ is less than the interquartile range of the heights in group $Q$."], "answer": "B", "img": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20540%20295%27%20width%3D%27540%27%20height%3D%27295%27%3E%3Crect%20width%3D%27540%27%20height%3D%27295%27%20fill%3D%27white%27/%3E%3Ctext%20x%3D%27275%27%20y%3D%2730%27%20font-size%3D%2716%27%20text-anchor%3D%27middle%27%20%20font-family%3D%27Noto%20Serif%2C%20Georgia%2C%20Ti u$"], "answer": "C"}]]}, {"id": 14, "title": "SAT Practice Test 14", "time": 2100, "modules": [[{"text": "<table class='dt'><tr><th>Nights<\/th><th>Guests<\/th><\/tr><tr><td>1<\/td><td>17<\/td><\/tr><tr><td>2<\/td><td>24<\/td><\/tr><tr><td>3<\/td><td>11<\/td><\/tr><tr><td>4<\/td><td>8<\/td><\/tr><\/table>The table summarizes the number of nights per week that each of 60 hotel guests stayed at a hotel. According to the table, how many guests stayed for exactly 3 nights?", "type": "mc", "choices": ["3", "8", "11", "60"], "answer": "C"}, {"text": "If $\\dfrac{2x+5}{3}-\\dfrac{x-4}{2}=3$, what is the value of $x$?", "type": "mc", "choices": ["$-4$", "8", "12", "20"], "answer": "A"}, {"text": "The function $g$ is defined by $g(x)=\\dfrac{x+21}{6}$. If $g(2x+3)=7$, what is the value of $x$?", "type": "mc", "choices": ["9", "18", "21", "42"], "answer": "A"}, {"text": "45% of a number is equal to 30% of 720. What is the number?", "type": "spr", "answer": ["480"]}, {"text": "$$W(d)=340-12d$$ The given function models the amount of water $W(d)$, in liters, remaining in a tank $d$ days after it was filled. Which of the following is the best interpretation of 340 in this context?", "type": "mc", "choices": ["The number of liters of water in the tank when it was filled", "The number of liters of water used each day", "The number of days until the tank is empty", "The number of liters of water remaining after 12 days"], "answer": "A"}, {"text": "A cube has a surface area of 294 square centimeters. What is the volume, in cubic centimeters, of this cube?", "type": "mc", "choices": ["49", "294", "343", "2,058"], "answer": "C"}, {"text": "On a map, the scale is $1:2{,}500{,}000$. Two towns are 6 centimeters apart on the map. What is the actual distance, in kilometers, between these two towns?", "type": "mc", "choices": ["15", "150", "1,500", "15,000"], "answer": "B"}, {"text": "$$3x+4y=31$$ $$5x-6y=1$$ The solution to the given system of equations is $(x,y)$. What is the value of $y$?", "type": "mc", "choices": ["4", "5", "9", "19"], "answer": "A"}, {"text": "Company A charges a $\\$90$ fee plus $\\$25$ per hour for a service. Company B charges a $\\$150$ fee plus $\\$15$ per hour for the same service. If $h$ represents the number of hours of service, what are all the values of $h$ for which Company B's total charge is less than Company A's total charge?", "type": "mc", "choices": ["$h\\lt 6$", "$h\\gt 6$", "$h\\lt 24$", "$h\\gt 24$"], "answer": "B"}, {"text": "A culture starts with 1,250 bacteria, and the number of bacteria doubles every 40 minutes. Which equation gives the number of bacteria, $N$, in the culture $h$ hours after the culture starts?", "type": "mc", "choices": ["$N=1{,}250(2)^{40h}$", "$N=1{,}250(2)^{\\frac{2h}{3}}$", "$N=1{,}250(2)^{\\frac{3h}{2}}$", "$N=1{,}250(2)^{\\frac{h}{40}}$"], "answer": "C"}, {"text": "In the $xy$-plane, line $p$ has a slope of $\\dfrac75$ and a $y$-intercept of $(0,-21)$. What is the $x$-coordinate of the $x$-intercept of line $p$?", "type": "spr", "answer": ["15"]}, {"text": "At a school with 500 students, each student travels to school by bus, by bicycle, or on foot. If one of these students is selected at random, the probability of selecting a student who travels by bus is 0.34, and the probability of selecting a student who travels by bicycle is 0.22. How many of these students travel to school on foot?", "type": "mc", "choices": ["110", "170", "220", "280"], "answer": "C"}, {"text": "$$y=3(x-2)(x-10)$$ What is the minimum value of $y$ for the given equation?", "type": "mc", "choices": ["$-48$", "$-16$", "6", "60"], "answer": "A"}, {"text": "What is the value of $\\tan B$ in the triangle shown?", "type": "mc", "choices": ["$\\dfrac{5}{13}$", "$\\dfrac{5}{12}$", "$\\dfrac{12}{13}$", "$\\dfrac{12}{5}$"], "answer": "B", "img": "data:image/svg+xml;charset=utf-8,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%20540%20315%27%20width%3D%27540%27%20height%3D%27315%27%3E%3Crect%20width%3D%27540%27%20height%3D%27315%27%20fill%3D%27white%27/%3E%3Cpolygon%20points%3D%2770%2C40%2070%2C250%20470%2C250%27%20fill%3D%27none%27%20stroke%3D%27%233b82c4%27%20stroke-width%3D%272.4%27%20stroke-linejoin%3D%27round%27/%3E%3Cpolyline%20points%3D%2770%2C232%2088%2C232%2088%2C250%27%20fill%3D%27none%27%20stroke%3D%27%233b82c4%27%20stroke-width%3D%271.6%27/%3E%3Ctext%20x%3D%2766%27%20y%3D%2730%27%20font-size%3D%2719%27%20text-anchor%3D%27middle%27%20fill%3D%27%231b1d24%27%20font-family%3D%27Noto%20Serif%2C%20Georgia%2C%20Times%20New%20Roman%2C%20serif%27%20font-style%3D%27italic%27%20%3EA%3C/text%3E%3Ctext%20x%3D%2766%27%20y%3D%27276%27%20font-size%3D%2719%27%20text-anchor%3D%27middle%27%20fill%3D%27%231b1d24%27%20font-family%3D%27Noto%20Serif%2C%20Georgia%2C%20Times%20New%20Roman%2C%20serif%27%20font-style%3D%27italic%27%20%3EC%3C/text%3E%3Ctext%20x%3D%27484%27%20y%3D%27268%27%20font-size%3D%2719%27%20text-anchor%3D%27middle%27%20fill%3D%27%231b1d24%27%20font-family%3D%27Noto%20Serif%2C%20Georgia%2C%20Times%20New%20Roman%2C%20serif%27%20font-style%3D%27italic%27%20%3EB%3C/text%3E%3Ctext%20x%3D%2750%27%20y%3D%27152%27%20font-size%3D%2719%27%20text-anchor%3D%27end%27%20fill%3D%27%231b1d24%27%20font-family%3D%27Noto%20Serif%2C%20Georgia%2C%20Times%20New%20Roman%2C%20serif%27%20%3E5%3C/text%3E%3Ctext%20x%3D%27290%27%20y%3D%27135%27%20font-size%3D%2719%27%20text-anchor%3D%27middle%27%20fill%3D%27%231b1d24%27%20font-family%3D%27Noto%20Serif%2C%20Georgia%2C%20Times%20New%20Roman%2C%20serif%27%20%3E13%3C/text%3E%3Ctext%20x%3D%27270%27%20y%3D%27300%27%20font-size%3D%2714%27%20text-anchor%3D%27middle%27%20fill%3D%27%231b1d24%27%20font-family%3D%27Noto%20Serif%2C%20Georgia%2C%20Times%20New%20Roman%2C%20serif%27%20font-style%3D%27italic%27%20%3ENote%3A%20Figure%20not%20drawn%20to%20scale.%3C/text%3E%3C/svg%3E"}, {"text": "The positive number $a$ is 250% of the positive number $b$, and $b$ is 40% of the positive number $c$. The number $a$ is what percent of $c$? (Disregard the percent symbol when entering your answer.)", "type": "spr", "answer": ["100"]}, {"text": "$$4x-6y=14$$ $$10x+ky=c$$ In the given system of equations, $k$ and $c$ are constants. If the system has infinitely many solutions, what is the value of $k+c$?", "type": "spr", "answer": ["20"]}, {"text": "A circle in the $xy$-plane has its center at $(-2,9)$, and the point $(6,3)$ lies on the circle. Which equation represents this circle?", "type": "mc", "choices": ["$(x-2)^2+(y+9)^2=10$", "$(x+2)^2+(y-9)^2=10$", "$(x-2)^2+(y+9)^2=100$", "$(x+2)^2+(y-9)^2=100$"], "answer": "D"}, {"text": "$$f(x)=3(x+4)^2-11$$ In the $xy$-plane, the graph of $y=f(x)$ is translated 5 units to the right and 6 units up. What is the vertex of the resulting graph?", "type": "mc", "choices": ["$(-9,-17)$", "$(-9,-5)$", "$(1,-17)$", "$(1,-5)$"], "answer": "D"}, {"text": "$$2\\sqrt{x+7}=x-1$$ What is the solution to the given equation?", "type": "spr", "answer": ["9"]}, {"text": "Two similar right circular cylinders have surface areas of $54\\pi$ square inches and $486\\pi$ square inches. The volume of the smaller cylinder is $40\\pi$ cubic inches. The volume of the larger cylinder is $V\\pi$ cubic inches, where $V$ is a constant. What is the value of $V$?", "type": "spr", "answer": ["1080"]}, {"text": "If $\\left(\\sqrt8\\right)^{a+2}=4^{a-1}$, what is the value of $a$?", "type": "spr", "answer": ["10"]}, {"text": "$$x^2-12x+c=0$$ In the given equation, $c$ is a constant. The equation has two distinct real solutions whose positive difference is 8. What is the value of $c$?", "type": "mc", "choices": ["8", "16", "20", "32"], "answer": "C"}], [{"text": "<table class='dt'><tr><th>$x$<\/th><td>1<\/td><td>2<\/td><td>3<\/td><td>4<\/td><\/tr><tr><th>$f(x)$<\/th><td>9<\/td><td>5<\/td><td>2<\/td><td>7<\/td><\/tr><tr><th>$g(x)$<\/th><td>3<\/td><td>1<\/td><td>4<\/td><td>2<\/td><\/tr><\/table>The table gives the values of the functions $f$ and $g$ at four values of $x$. What is the value of $f\\big(g(3)\\big)$?", "type": "mc", "choices": ["2", "4", "7", "9"], "answer": "C"}, {"text": "Which expression is equivalent to $\\dfrac{x^2-36}{x^2-2x-24}$, where $x\\gt 6$?", "type": "mc", "choices": ["$\\dfrac32$", "$\\dfrac{x-6}{x+4}$", "$\\dfrac{x+6}{x-4}$", "$\\dfrac{x+6}{x+4}$"], "answer": "D"}, {"text": "In one class of 20 students, the mean score on a test was 70. In a second class of $n$ students, the mean score on the same test was 90. The mean score for all the students in both classes was 82. What is the value of $n$?", "type": "mc", "choices": ["25", "30", "35", "40"], "answer": "B"}, {"text": "If $7(3x-4)+20=4(3x-4)+41$, what is the value of $(3x-4)^3$?", "type": "mc", "choices": ["7", "21", "343", "2,401"], "answer": "C"}, {"text": "The polynomial function $p$ is defined by $p(x)=a(x+2)(x-3)(x-5)$, where $a$ is a constant. In the $xy$-plane, the graph of $y=p(x)$ passes through the point $(1,48)$. What is the value of $p(0)$?", "type": "mc", "choices": ["24", "30", "48", "60"], "answer": "D"}, {"text": "$$y\\ge 3x-5$$ $$y\\lt -2x+8$$ Which point $(x,y)$ is a solution to the given system of inequalities in the $xy$-plane?", "type": "mc", "choices": ["$(0,-6)$", "$(2,1)$", "$(2,4)$", "$(4,3)$"], "answer": "B"}, {"text": "Line $m$ passes through the points $(-2,7)$ and $(6,1)$ in the $xy$-plane. Line $n$ is perpendicular to line $m$ and passes through the point $(9,-2)$. Which equation defines line $n$?", "type": "mc", "choices": ["$3x+4y=19$", "$4x-3y=42$", "$4x+3y=30$", "$3x-4y=35$"], "answer": "B"}, {"text": "A linear model estimates the number of registered vehicles, in thousands, in a city. The model estimates there were 37 thousand registered vehicles in 2008, 154 thousand in 2023, and $x$ thousand in 2019. To the nearest whole number, what is the value of $x$?", "type": "spr", "answer": ["123"]}, {"text": "A sample of a substance decays so that its mass is reduced by $\\frac14$ of its value every 18 months. If the initial mass of the sample is $M$ grams, which e  <div class="grid" style="max-width:600px;margin:auto">${S.ans[S.m].map((a,k)=>`<button class="g ${a.v?"done":""} ${S.flag[S.m][k]?"f":""}" onclick="go(${k})">${k+1}</button>`).join("")}</div></div></div>`,
 `<footer class="nav"><span class="who">${esc(NAME||S.t.title)}</span><span></span><span class="r"><button class="btn" onclick="go(n_last())">Back</button><button class="btn" onclick="confirmEnd()">${S.m===0?"Submit Module 1":"Submit Test"}</button></span></footer>`)}
function n_last(){return S.t.modules[S.m].length-1}
function confirmEnd(){const un=S.ans[S.m].filter(a=>!a.v).length;
 const d=document.createElement("div");d.className="mask";d.innerHTML=`<div><h3>${S.m===0?"Submit Module 1?":"Submit the test?"}</h3><p style="color:var(--mut)">${un?`<b class="bad">${un} question(s) unanswered.</b> `:""}You can't return to this module after submitting.</p><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn o" onclick="this.closest('.mask').remove()">Cancel</button><button class="btn" onclick="this.closest('.mask').remove();finishModule()">Submit</button></div></div>`;document.body.appendChild(d)}
function finishModule(){if(S.m===0){S.m=1;S.i=0;S.left=S.t.time||2100;popOpen=false;breakScreen()}else{clearInterval(timer);results()}}
function breakScreen(){clearInterval(timer);closeCalc();closeRef();$("#app").innerHTML=`<div class="home" style="display:grid;place-items:center"><div class="panel" style="text-align:center;max-width:480px"><div class="brand" style="justify-content:center"><i>✓</i></div><h2>Module 1 submitted</h2><p style="color:var(--mut)">Module 2 has 22 questions and ${Math.round((S.t.time||2100)/60)} minutes. The timer starts when you continue.</p><button class="btn" onclick="runTimer();render()">Start Module 2</button></div></div>`}

function num(s){s=String(s).replace(/\s/g,"");if(/^-?\d*\.?\d+\/-?\d*\.?\d+$/.test(s)){const[a,b]=s.split("/");return a/b}const v=Number(s);return s===""?NaN:v}
function ok(q,a){if(!a.v)return false;if(q.type!=="spr")return a.v===q.answer;const u=num(a.v.replace(/,/g,''));return [].concat(q.answer).some(c=>String(c).replace(/\s/g,"")===a.v.replace(/\s/g,"")||(!isNaN(u)&&Math.abs(num(c)-u)<1e-9))}
let RT=0;
function results(){localStorage.removeItem('satS');closeCalc();closeRef();document.body.classList.remove('intest');let raw=0;const per=[0,0];
 S.t.modules.forEach((m,mi)=>m.forEach((q,i)=>{if(ok(q,S.ans[mi][i])){raw++;per[mi]++}}));
 const total=S.t.modules.reduce((s,m)=>s+m.length,0),sc=S.t.scale&&S.t.scale[raw];
 const rows=mi=>S.t.modules[mi].map((q,i)=>{const a=S.ans[mi][i],r=ok(q,a);return `<tr class="r" onclick="showQ(${mi},${i})"><td><b>${i+1}</b></td><td>${esc(a.v||"—")}</td><td>${esc([].concat(q.answer)[0])}</td><td><span class="tag ${r?"ok":"bad"}">${r?"Correct":a.v?"Incorrect":"Omitted"}</span></td></tr>`}).join("");
 window._rows=rows;
 $("#app").innerHTML=`<div class="page" style="padding-top:40px"><div class="panel"><div class="score"><div class="ring" style="--p:${Math.round((sc-200)/6)}"><div><span><b>${sc}</b><br><small>Math score</small></span></div></div>
 <div><div class="brand">${esc(S.t.title)}</div><h2 style="margin:6px 0">${raw} / ${total} correct</h2><div>Likely range: <b>${S.t.range[raw]}</b> · Level: <b>${raw>=40?"Exceptional":raw>=33?"Strong":raw>=25?"Proficient":raw>=16?"Developing":"Building"}</b></div>
 <div class="stats"><span>Module 1: <b>${per[0]}/${S.t.modules[0].length}</b></span><span>Module 2: <b>${per[1]}/${S.t.modules[1].length}</b></span></div>
 <p style="color:var(--mut);font-size:13px;margin:10px 0 0">The Digital SAT is adaptive, so this is an estimate — use it to track progress.</p></div></div></div>
 <div class="panel"><div class="tabs"><button id="rt0" class="on" onclick="rtab(0)">Module 1</button><button id="rt1" onclick="rtab(1)">Module 2</button></div><p style="color:var(--mut);font-size:14px;margin:0 0 6px">Tap a row to see the question.</p>
 <table class="rt"><thead><tr><th>#</th><th>Your answer</th><th>Correct</th><th></th></tr></thead><tbody id="rtb">${rows(0)}</tbody></table>
 <p style="margin-top:18px"><button class="btn" onclick="home()">Back to tests</button></p></div></div>`}
function rtab(m){$("#rtb").innerHTML=window._rows(m);$("#rt0").className=m?"":"on";$("#rt1").className=m?"on":""}

function dframe(t){const box=t?$("#dsci"):$("#dc");if(!box.querySelector("iframe")){box.innerHTML=`<div class="load">Loading Desmos…</div>`;const f=document.createElement("iframe");f.src=DURL[t];f.title=t?"Desmos Scientific Calculator":"Desmos Graphing Calculator";f.allow="clipboard-read; clipboard-write; fullscreen";f.style.cssText="width:100%;height:100%;border:0;display:block";f.onload=()=>{const l=box.querySelector(".load");if(l)l.remove()};box.appendChild(f)}}
function calcTab(t){tab=t;$("#dc").style.display=t?"none":"block";$("#dsci").style.display=t?"block":"none";$("#tg").className=t?"":"on";$("#ts").className=t?"on":"";dframe(t)}
function setRef(){const b=document.querySelectorAll(".tools .tool");if(b[1])b[1].classList.toggle("on",!!document.getElementById("refo"))}
function setTools(){const b=document.querySelectorAll('.tools .tool');if(b[0])b[0].classList.toggle('on',document.body.classList.contains('cc'))}
function closeCalc(){document.body.classList.remove("cc");setTools()}
function toggleCalc(){if(document.body.classList.contains("cc"))return closeCalc();if(innerWidth<=680)closeRef();document.body.classList.add("cc");setCW(panelW('desmos')||Math.min(innerWidth*.42,580));setTools();dframe(tab)}
/* ---- panel sizing: Desmos (left) + Reference (right), Bluebook style ---- */
const RS=document.documentElement.style,px=v=>Math.round(v)+'px';
const MINQ=360;            // keep at least this much room for the question
const availH=()=>innerHeight-parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--hh'))-parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fh'));
const panelW=id=>{const e=document.getElementById(id);return e&&getComputedStyle(e).display!=='none'?e.getBoundingClientRect().width:0};
const isFl=()=>document.body.classList.contains('cfl');
function setCW(w){if(isFl()){const l=$('#desmos').getBoundingClientRect().left;w=Math.max(300,Math.min(innerWidth-l-4,w))}else{const other=document.body.classList.contains('rr')?panelW('refo'):0;w=Math.max(300,Math.min(innerWidth-other-MINQ,w))}RS.setProperty('--cw',px(w))}
function setRW(w){const other=document.body.classList.contains('cc')?panelW('desmos'):0;w=Math.max(300,Math.min(innerWidth-other-MINQ,w));RS.setProperty('--rw',px(w))}
function setH(v,h){let mx=availH();if(v==='--ch'&&isFl())mx=innerHeight-$('#desmos').getBoundingClientRect().top-parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fh'));h=Math.max(260,Math.min(mx,h));if(v==='--ch'&&isFl()){RS.setProperty(v,px(h));return}RS.setProperty(v,h>=availH()-2?'':px(h));if(h>=availH()-2)RS.removeProperty(v)}
function calcDock(){document.body.classList.remove('cfl');RS.removeProperty('--cx');RS.removeProperty('--cy')}
function calcExpand(){if(!$("#exb"))return;calcDock();wide=!wide;RS.removeProperty('--ch');setCW(wide?innerWidth*.66:Math.min(innerWidth*.42,580));$("#exb").textContent=wide?"⤡":"⤢";$("#exb").title=wide?"Collapse":"Expand"}
let rwide=false;
function refExpand(){rwide=!rwide;RS.removeProperty('--rh');setRW(rwide?innerWidth*.62:Math.min(innerWidth*.4,520));const b=$("#rexb");if(b){b.textContent=rwide?"⤡":"⤢";b.title=rwide?"Collapse":"Expand"}}
function dragger(h,cls,move){h.addEventListener('pointerdown',e=>{if(innerWidth<=680)return;e.preventDefault();document.body.classList.add('drag',cls);h.setPointerCapture(e.pointerId);
 const mv=ev=>move(ev);const up=()=>{document.body.classList.remove('drag',cls);h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);calc&&calc.resize();sci&&sci.resize()};
 h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up)})}
const topY=()=>document.querySelector('header.top')?document.querySelector('header.top').getBoundingClientRect().bottom:76;
const dR=()=>$('#desmos').getBoundingClientRect();
dragger($('#drs'),'dragx',ev=>setCW(ev.clientX-dR().left));
dragger($('#dcr'),'dragc',ev=>{const r=dR();setCW(ev.clientX-r.left);setH('--ch',ev.clientY-r.top)});
/* move the calculator by its title bar (Bluebook style). Drop it on the left edge to dock it again. */
/* phones: drag the dark top bar of the Calculator / Reference sheet up or down to resize it */
/* phones: Bluebook-style floating panels — drag the dark bar to move, drag the round corner button to resize */
function phoneVars(){const cs=getComputedStyle(document.documentElement);return{hh:parseFloat(cs.getPropertyValue('--hh')),fh:parseFloat(cs.getPropertyValue('--fh'))}}
function phoneDrag(el,fn){el.addEventListener('pointerdown',e=>{if(innerWidth>680||e.target.closest('button:not(.grip)'))return;e.preventDefault();e.stopPropagation();
 el.setPointerCapture(e.pointerId);document.body.classList.add('drag');const st=fn(e);
 const mv=ev=>st(ev);const up=()=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);document.body.classList.remove('drag')};
 el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up)})}
function phonePanel(panel,bar,grip,p,gripLeft){
 phoneDrag(bar,e=>{const r=panel.getBoundingClientRect(),ox=e.clientX-r.left,oy=e.clientY-r.top,{hh,fh}=phoneVars();
  return ev=>{const x=Math.max(0,Math.min(innerWidth-r.width,ev.clientX-ox)),y=Math.max(hh,Math.min(innerHeight-fh-60,ev.clientY-oy));RS.setProperty('--'+p+'x',px(x));RS.setProperty('--'+p+'y',px(y))}});
 phoneDrag(grip,e=>{const r=panel.getBoundingClientRect(),{fh}=phoneVars();
  return ev=>{let w;if(gripLeft){const x=Math.max(0,Math.min(r.right-240,ev.clientX));w=r.right-x;RS.setProperty('--'+p+'x',px(x))}else w=Math.max(240,Math.min(innerWidth-r.left,ev.clientX-r.left));
   const h=Math.max(200,Math.min(innerHeight-fh-r.top,ev.clientY-r.top));RS.setProperty('--'+p+'w',px(w));RS.setProperty('--'+p+'h',px(h))}})}
phonePanel($('#desmos'),$('#dh'),$('#dcr'),'mc',false);
(function(){const h=$('#dh');h.addEventListener('pointerdown',e=>{if(e.button!==0||e.target.closest('button')||innerWidth<=680)return;
 e.preventDefault();const r=dR(),ox=e.clientX-r.left,oy=e.clientY-r.top,sx=e.clientX,sy=e.clientY;let moved=false;h.setPointerCapture(e.pointerId);
 const top0=topY(),fh=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--fh'));
 const mv=ev=>{if(!moved){if(Math.abs(ev.clientX-sx)+Math.abs(ev.clientY-sy)<5)return;moved=true;document.body.classList.add('drag','dragm');
   if(!isFl()){RS.setProperty('--ch',px(Math.min(r.height,innerHeight*.72)));document.body.classList.add('cfl')}}
  const w=dR().width,x=Math.max(0,Math.min(innerWidth-w,ev.clientX-ox)),y=Math.max(top0,Math.min(innerHeight-fh-60,ev.clientY-oy));
  RS.setProperty('--cx',px(x));RS.setProperty('--cy',px(y));
  const hh=dR().height,mh=innerHeight-y-fh;if(hh>mh)RS.setProperty('--ch',px(Math.max(260,mh)))};
 const up=()=>{h.removeEventListener('pointermove',mv);h.removeEventListener('pointerup',up);h.removeEventListener('pointercancel',up);document.body.classList.remove('drag','dragm');
  if(moved&&dR().left<12){calcDock();RS.removeProperty('--ch');setCW(dR().width)}calc&&calc.resize();sci&&sci.resize()};
 h.addEventListener('pointermove',mv);h.addEventListener('pointerup',up);h.addEventListener('pointercancel',up)})})();
addEventListener('resize',()=>{if(document.body.classList.contains('cc'))setCW(panelW('desmos'));if(document.body.classList.contains('rr'))setRW(panelW('refo'))});
document.addEventListener('keydown',e=>{if(e.key==="Escape"){const m=document.querySelector('.mask');if(m)m.remove();else if(popOpen){popOpen=false;render()}}});

const BM=on=>`<svg width="16" height="20" viewBox="0 0 18 22"><path d="M2 2h14v18l-7-5-7 5z" fill="${on?"#d64545":"none"}" stroke="${on?"#d64545":"currentColor"}" stroke-width="2"/></svg>`;
function fig(src){const svg=src.startsWith('data:image/svg');const base=svg?100:60;return `<div class="fig"><div class="zb"><button onclick="zoom(.8)" title="Zoom out">－</button><span id="zp">${Math.round(Z*100)}%</span><button onclick="zoom(1.25)" title="Zoom in">＋</button><button onclick="zoom(0)">Reset</button><button onclick="zfull()" title="Full screen">⛶</button></div><div class="zv"><img id="zi" data-b="${base}" src="${src}" style="width:${Math.round(Z*base)}%;max-width:none"></div></div>`}
function zoom(f){Z=f?Math.min(3,Math.max(.5,Z*f)):1;const i=$("#zi");i.style.width=Math.round(Z*i.dataset.b)+"%";$("#zp").textContent=Math.round(Z*100)+"%"}
function zfull(){modal(`<img src="${Q().img}" style="width:100%">`)}
function closeRef(){const o=document.getElementById("refo");if(o)o.remove();document.body.classList.remove('rr');setRef()}
function refSheet(){if(document.getElementById("refo"))return closeRef();if(innerWidth<=680)closeCalc();const d=document.createElement("div");d.id="refo";
 d.innerHTML=`<div class="rb"><b>Reference</b><span class="mvdots rdots"><i></i><i></i><i></i><i></i><i></i><i></i></span><button class="ex" id="rexb" title="${rwide?"Collapse":"Expand"}" onclick="refExpand()">${rwide?"⤡":"⤢"}</button><button class="cx" title="Close reference" onclick="closeRef()">✕</button></div><div class="rbody"><div class="rgrid">${REFT.map((r,i)=>`<div class="rt${i===4?" w2":""}"><img src="${r.src}" style="max-width:${Math.round(r.w*.8)}px" alt="" draggable="false"></div>`).join("")}</div><ul class="rfacts"><li>The number of degrees of arc in a circle is 360.</li><li>The number of radians of arc in a circle is $2\\pi$.</li><li>The sum of the measures in degrees of the angles of a triangle is 180.</li></ul></div><div id="rrs" class="edge" title="Drag to resize"><i></i></div><div id="rcr" class="grip" title="Drag to resize"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 7L7 17M17 7v5M17 7h-5M7 17v-5M7 17h5"/></svg></div>`;
 document.body.appendChild(d);tex(d);document.body.classList.add('rr');phonePanel(d,d.querySelector('.rb'),d.querySelector('#rcr'),'mr',true);setRW(panelW('refo'));setRef();
 dragger(d.querySelector('#rrs'),'dragx',ev=>setRW(innerWidth-ev.clientX));
 dragger(d.querySelector('#rcr'),'dragc2',ev=>{setRW(innerWidth-ev.clientX);setH('--rh',ev.clientY-topY())})}
function dirs(){modal(`<h3>Directions</h3><p>The questions in this section address a number of important math skills. <b>Use of a calculator is permitted for all questions.</b> A reference sheet, calculator, and these directions can be accessed throughout the test.</p><p><b>Unless otherwise indicated:</b></p><ul><li>All variables and expressions represent real numbers.</li><li>Figures provided are drawn to scale.</li><li>All figures lie in a plane.</li><li>The domain of a given function $f$ is the set of all real numbers $x$ for which $f(x)$ is a real number.</li></ul><p>For multiple-choice questions, solve each problem and choose the best answer. For student-produced response questions, enter your answer in the box. If your answer is a fraction that doesn’t fit, enter its decimal equivalent. Enter a negative sign as “−”. A fraction bar is “/”. You may enter at most 5 characters (6 if negative).</p>`)}
function more(){modal(`<h3>More</h3><p><button class="btn" onclick="exitSave()">Save &amp; exit — resume later</button></p><p style="color:var(--mut)">Your timer is paused while you are away. Progress is saved in this browser on this device.</p>`)}
function exitSave(){document.querySelectorAll(".mask").forEach(m=>m.remove());save(true);clearInterval(timer);S=null;home()}
function save(p){if(!S)return;try{localStorage.setItem("satS",JSON.stringify({id:S.t.id,m:S.m,i:S.i,ans:S.ans,flag:S.flag,left:S.left,hide:S.hide,at:Date.now(),p:p===true}))}catch(e){}}
function saved(){try{const d=JSON.parse(localStorage.getItem("satS"));const t=TESTS.find(x=>x.id==d.id);return t?{...d,t}:null}catch(e){return null}}
function resume(){const d=saved();if(!d)return home();S={t:d.t,m:d.m,i:d.i,ans:d.ans,flag:d.flag,hide:d.hide,left:d.p?d.left:Math.max(1,d.left-Math.floor((Date.now()-d.at)/1000))};popOpen=false;runTimer();render()}
function modal(html){const d=document.createElement("div");d.className="mask";d.innerHTML=`<div style="max-width:720px;width:94vw;max-height:88vh;overflow:auto">${html}<p style="text-align:right;margin-bottom:0"><button class="btn" onclick="this.closest('.mask').remove()">Close</button></p></div>`;d.addEventListener('click',e=>{if(e.target===d)d.remove()});document.body.appendChild(d);tex(d)}
function showQ(mi,i){const q=S.t.modules[mi][i],a=S.ans[mi][i];modal(`<b>Module ${mi+1} · Question ${i+1}</b><div class="qtext" style="margin-top:10px">${q.img?`<img src="${q.img}" style="max-width:100%"><br>`:""}${q.text}</div>${q.type==="spr"?`<p>Your answer: <b>${esc(a.v||"—")}</b><br>Correct answer: <b>${esc([].concat(q.answer).join(" or "))}</b></p>`:`<div class="chs">`+q.choices.map((c,k)=>{const L="ABCD"[k];return `<div class="ch" style="cursor:default;${L===q.answer?"border-color:var(--ok);box-shadow:0 0 0 2px var(--ok);background:#e9f7ef":L===a.v?"border-color:var(--bad);background:#fdecec":""}"><span class="L">${L}</span><span class="t">${c}</span><b>${L===q.answer?"✓":L===a.v?"✗ yours":""}</b></div>`}).join("")+`</div>`}`)}
home();
</script></body></html>
